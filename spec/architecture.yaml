version: "0.3"
project: Leviathan
purpose: >-
  Research specification for one persistent adaptive agent with exactly one cognitive
  model, persistent belief state, metacognitive routing, multiple reasoning/search
  modes, native actions, verification, multi-tier memory, procedural compilation and
  safe continual learning.

agent:
  identity_owner: unified_agent
  identity_count: 1
  cognitive_model_count: 1
  independent_internal_model_count: 0
  model_state_count: 1
  optimizer_count: 1
  checkpoint_count: 1
  state_owner: unified_agent
  action_gateway_count: 1
  original_goal: immutable_and_externally_inspectable
  detailed_contract: "spec/one-agent.yaml"
  module_semantics: >-
    Named cognitive modules are typed projections, heads, or state transitions inside
    the one model. They are not separately prompted, optimized, checkpointed, or given
    private task state. External prototypes remain experiments until distilled into the
    one runtime checkpoint.

invariants:
  - id: no_raw_core_updates
    rule: "Raw experience MUST NOT directly update core parameters."
  - id: provenance_required
    rule: "Every promoted memory and learning sample MUST retain provenance."
  - id: simulation_labeled
    rule: "Simulated evidence MUST remain distinguishable from grounded evidence."
  - id: learner_not_governor
    rule: "The learner MUST NOT control final verifier policy, deployment signing, rollback, or promotion authority."
  - id: rollback_required
    rule: "Every parametric update MUST have a rollback path."
  - id: goal_integrity
    rule: "The original external goal MUST remain inspectable and immutable by the learner."
  - id: strict_single_model
    rule: "Cognition MUST have one parameter owner, shared state, router, objective, optimizer, checkpoint, and output."
  - id: bounded_recursion
    rule: "Shared-state refinement and outer task cycles MUST have explicit hard budgets."
  - id: failed_inference_stops_action
    rule: "Model failure, invalid output, or budget exhaustion MUST NOT fall through to external action."

loops:
  fast:
    timescale: "milliseconds_to_seconds"
    flow:
      - perception
      - adaptive_representation
      - compute_router
      - belief_update
      - short_horizon_prediction
      - native_action
  deliberative:
    timescale: "seconds_to_hours"
    flow:
      - belief_state
      - meta_controller
      - reasoning_or_search
      - hierarchical_plan
      - tool_or_environment_action
      - verification
      - belief_revision
  consolidation:
    timescale: "minutes_to_weeks"
    flow:
      - trajectory_extraction
      - verification_gate
      - causal_credit
      - novelty_utility_scoring
      - memory_promotion
      - optional_plastic_update
      - regression_evaluation
      - optional_core_consolidation

modules:
  unified_agent:
    owns:
      - stable_identity
      - immutable_goal_frame
      - serialized_cognitive_state
      - append_only_event_journal
      - action_contracts
      - executor_boundary
      - verifier_boundary
      - verified_learning_gate
    cannot_modify:
      - root_constitution
      - final_verifier_policy
      - deployment_promotion
      - rollback_authority

  unified_cognitive_model:
    exact_counts:
      parameter_owners: 1
      shared_states: 1
      routers: 1
      objectives: 1
      optimizers: 1
      checkpoints: 1
      outputs: 1
    parameter_substrate:
      - dense_base_transform
      - tensorized_low_rank_basis_bank
      - differentiable_top_k_router
      - one_weighted_parameter_update
    basis_may_not_have:
      - identity
      - private_state
      - goal
      - callable_model_interface
      - independent_output
      - independent_optimizer
    current_evidence:
      - exact_zero_insertion_parity
      - conditional_operator_learning
      - staged_sparse_training
    current_rejections:
      - posthoc_sparsification
      - unfused_runtime_speed_claim
      - recurrence_without_sequence_evidence
    learning_boundary: "Only independently verified evidence may enter an offline, rollbackable model update."

  perception:
    responsibilities:
      - text
      - vision
      - audio
      - environment_sensors
    lessons:
      - "BLT: adaptive representation granularity"
      - "ShowUI: selective visual compute"
      - "Qwen3-Omni: native multimodal representations"

  adaptive_representation:
    policy_inputs:
      - entropy
      - novelty
      - task_relevance
      - risk
    outputs:
      - latent_units
      - resolution_metadata

  compute_router:
    policy_inputs:
      - context_difficulty
      - uncertainty
      - stakes
      - hardware_load
    outputs:
      - active_parameter_bases_inside_the_same_model
      - precision
      - reasoning_budget
    lessons:
      - "LongCat: dynamic active compute"
      - "Step/Kimi: sparse capacity"
      - "hardware-aware routing"

  belief_state:
    fields:
      - facts
      - hypotheses
      - causal_edges
      - uncertainty
      - provenance
      - goals
      - constraints
      - contradictions
      - active_plan
      - failed_attempts
      - open_questions

  world_model:
    operations:
      - estimate_state
      - predict_forward
      - compare_counterfactuals
      - estimate_uncertainty
      - estimate_information_gain
      - retrospective_counterfactual
    sources:
      - Cosmos
      - V-JEPA-2
      - JEPA-WM

  meta_controller:
    modes:
      - DIRECT
      - RECALL
      - SKILL
      - REASON
      - TREE_SEARCH
      - EVOLVE
      - SIMULATE
      - EXPERIMENT
      - TOOL
      - PARALLELIZE
      - ASK
      - ACT
      - WAIT_OBSERVE
    utility_terms:
      positive:
        - expected_success_gain
        - information_gain
        - transfer_value
      negative:
        - compute_cost
        - latency_cost
        - risk_cost
        - irreversibility
        - hardware_congestion

  planner:
    hierarchy:
      - goal
      - semantic_subgoal
      - operation
      - action_chunk
      - low_level_action
    supports_dag: true

  action_bus:
    heads:
      - text
      - speech
      - gui_region
      - structured_api
      - robot_continuous
      - robot_tokenized
      - image_video
    rule: "Use native action geometry when available; do not force every action through text."

  tool_registry:
    preference_order:
      - formal_solver
      - deterministic_api
      - database_query
      - structured_ui_tree
      - vision_grounding
      - raw_coordinate
    capabilities:
      - retrieval
      - schema_validation
      - recovery
      - parallel_execution

  verifier:
    trust_order:
      - grounded_reality
      - formal_proof
      - deterministic_execution
      - trusted_measurement
      - independent_model
      - learned_verifier
      - same_model_self_critique
    output:
      - result
      - confidence
      - provenance
      - independence_score
      - calibration_profile

  credit_assignment:
    inputs:
      - trajectory_dag
      - process_rewards
      - final_outcome
      - verifier_events
      - counterfactual_estimates
    outputs:
      - node_credit
      - node_blame
      - confidence

  memory:
    tiers:
      working:
        update_rate: fastest
      episodic:
        stores: "prediction-action-observation-verification trajectories"
      semantic:
        stores: "generalized claims with evidence links and contradictions"
      procedural:
        stores: "versioned executable skills with preconditions and verifiers"
      parametric:
        plastic:
          update_rate: slow
          rollback: required
        core:
          update_rate: slowest
          rollback: required
          shadow_evaluation: required

  consolidation:
    gates:
      - verifier_quality
      - provenance_quality
      - novelty
      - utility
      - consistency
      - transfer_value
      - regression_safety
    order:
      - episodic
      - semantic_or_procedural
      - plastic_candidate
      - sandbox_training
      - regression_suite
      - safety_suite
      - calibration_suite
      - shadow_deployment
      - optional_core_promotion

  curriculum:
    objective_terms:
      positive:
        - learning_progress
        - future_usefulness
        - transfer
        - verifier_reliability
      negative:
        - cost
        - risk
    restrictions:
      - "Novelty alone is insufficient."
      - "Simulator-only discoveries require grounded validation before real-world semantic promotion."

serving:
  recommended_features:
    - continuous_batching
    - paged_kv_cache
    - prefix_cache
    - speculative_decoding
    - multi_token_prediction_where_supported
    - expert_parallelism
    - fused_kernels
    - cuda_graphs
    - quantized_serving
    - async_tools
  metrics:
    - time_to_first_token
    - inter_token_latency
    - single_stream_tokens_per_second
    - aggregate_tokens_per_second
    - active_parameters
    - hbm_bandwidth
    - kv_cache_bytes
    - reasoning_tokens_per_task
    - tool_calls_per_task
    - wall_clock_task_time
    - task_success_rate
    - cost_per_successful_task

research_blockers:
  - stable_universal_belief_state
  - open_world_verification
  - long_horizon_causal_credit
  - safe_frontier_scale_continual_learning
  - cross_domain_metacognition
  - simulator_grounding
  - lifetime_calibration
  - curriculum_integrity
  - verifier_independence
  - self_modification_governance
