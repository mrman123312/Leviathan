version: '0.4'
name: Leviathan consumer recurrent architecture
single_cognitive_model: true
historical_full_module_graph: spec/architecture-legacy.yaml
# Historical graph is preserved, not an override of the current substrate.
current_contracts:
  substrate: spec/consumer-substrate.toml
  cognition: spec/cognitive-kernel.toml
  cells: spec/parameter-cells.toml
  maturity: spec/architecture-maturity.toml
  remaining_work: spec/consumer-checklist.json
modules:
  parameter_substrate:
    canonical_checkpoint: qwen3.8-27b
    canonical_stage: posttrained
    consumer_pretrain: qwen3-1.7b-base
    target: dense_qwen_swiglu_and_recurrent_graft
    initial_tile_width: 128
    fallback: original_selected_donor_FFN
    rules:
      - Preserve original donor computation at zero influence.
      - Keep attention, DeltaNet, positional encoding and causal caches unchanged.
      - Never treat foreign packed quantized weights as plain matrices.
      - Do not claim cell sparsity saves compute while the full dense donor still runs.
  recurrent_fabric:
    scope: selected_decoder_FFN_adapter_not_full_backbone
    transition: shared_slot_transformer_plus_optional_ancestral_cells
    inputs: [causal_donor_hidden_state, depth_local_cell_state, bounded_fast_state]
    outputs: [zero_gated_residual, depth_trace, route_trace]
    token_local: true
    persistent_cross_request_state: false
    default_ffns: [-1]
  cell_ecology:
    pipeline: [seed, propose, communicate, measure_disagreement, recruit, revise, commit]
    cross_layer_routing: false
    confidence_calibrated: false
    independent_cells_are_agents: false
  adaptive_representation:
    scope: heuristic_plans_and_untrained_latent_slots
    learned_semantic_branch_merge: false
  belief_memory:
    reference: src/leviathan/memory_ecology.py
    prompt_integration: pending
    promotion_requires_independent_evidence: true
  cognitive_control:
    reference: src/leviathan/cognitive_kernel.py
    learned_algorithm_synthesis: pending
    uncertainty_does_not_equal_message_variance: true
  world_model:
    theory_induction: pending
    simulation_is_ground_truth: false
  learning:
    candidate_only_graft_training: scripts/train_consumer_graft.py
    raw_experience_updates_core: false
    rollback_required: true
    external_promotion_authority_required: true
  execution:
    nf4_baseline_loader: true
    sparse_nf4_cell_kernel: false
    self_speculative_reference: same_weights_shallow_deep_full_prefix_replay
    production_mtp_cache_rollback: pending
    custom_asic_implemented: false
acceptance:
  gates: [specification, executable, integrated, learned, demonstrated]
  protected: [language_retention, ARC_Easy, ARC_Challenge, knowledge, math, coding, calibration, safety, wall_clock]
  no_automatic_promotion: true
