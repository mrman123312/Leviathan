version = "0.2"
name = "Leviathan architecture embodiment ledger"
single_cognitive_model = true

[maturity]
gates = ["specification", "executable", "integrated", "learned", "demonstrated"]
rule = "A layer is not called achieved until all five gates pass. Code/data structures alone never count as demonstration."

[development]
build_order = ["L1", "L1.5", "L2", "L5", "L8", "L6", "L7", "L9", "L4", "L3", "L0", "L10"]

[layers.L0]
name = "physical execution"
target_fundamental = "hardware-aware information transformation and cognitive IR"
evidence = "metrics/runtime hooks exist; optimized Leviathan execution substrate does not"
[layers.L0.gates]
specification = "passed"
executable = "partial"
integrated = "not_started"
learned = "not_started"
demonstrated = "not_started"

