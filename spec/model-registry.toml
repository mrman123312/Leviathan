version = "0.2"

# The registry stores metadata only. Do not commit model weights to Git.
# Revisions should be pinned to an immutable commit hash before any experiment is declared reproducible.

[defaults]
model_root = "models/checkpoints"
cache_root = ".cache/huggingface"
require_revision_pin_for_training = true
allow_remote_code_by_default = false

[[models]]
id = "deepseek-v4-pro-base"
repo_id = "deepseek-ai/DeepSeek-V4-Pro-Base"
role = "frontier_semantic_substrate"
stage = "base"
license = "MIT"
total_parameters_b = 1600.0
active_parameters_b = 49.0
multimodal = false
enabled_for_download = false
priority = 1
notes = "Canonical R4/Omega-L substrate. Full pretrained DeepSeek V4 target for MoP conversion; multi-terabyte class and explicit opt-in required."

