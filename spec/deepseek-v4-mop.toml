version = "0.1"

[model]
registry_id = "deepseek-v4-pro-base"
repo_id = "deepseek-ai/DeepSeek-V4-Pro-Base"
stage = "base"
role = "canonical_r4_and_omega_l_substrate"

# Contract verified against the upstream DeepSeek-V4-Pro-Base config on 2026-09-04.
# Experiments must still pin an immutable upstream revision and validate the local
# config before loading weights.

[architecture]
model_type = "deepseek_v4"
architecture_class = "DeepseekV4ForCausalLM"
hidden_size = 7168
num_hidden_layers = 61
moe_intermediate_size = 3072
n_routed_experts = 384
n_shared_experts = 1
num_experts_per_tok = 6
num_attention_heads = 128
num_key_value_heads = 1
head_dim = 512
max_position_embeddings = 1048576
num_nextn_predict_layers = 1
hc_mult = 4
vocab_size = 129280

[quantization]
expert_dtype = "fp8"
weight_block_size = [128, 128]

[mop]
target = "routed_moe_ffn"
tile_width = 128
shared_expert_policy = "preserve_original"
original_router_policy = "preserve_through_mop1"
scalar_parameter_routing = false
expert_averaging = false
attention_changes_in_r4 = false
residual_topology_changes_in_r4 = false

[phases.mop_0]
name = "exact_parameter_tile_decomposition"
train = false
goal = "Represent every routed expert as exact channel tiles while preserving the original expert router and pretrained function."
required = ["logit_parity", "hidden_state_parity", "no_checkpoint_retraining"]

[phases.mop_1]
name = "learn_tile_router_with_donor_frozen"
train = true
core_frozen = true
goal = "Train tile-level routing while retaining the original expert path as the zero-loss reference."
required = ["retention_pass", "router_calibration", "route_load_balance"]

[phases.mop_2]
name = "reduce_active_tiles"
train = true
goal = "Lower active parameter traffic only when capability and real wall-clock efficiency are preserved."
sweep_tile_widths = [256, 128, 64]
required = ["capability_pass", "retention_pass", "wall_clock_not_worse", "hbm_not_worse"]

[phases.mop_3]
name = "retire_redundant_expert_routing"
train = true
goal = "Retire the original expert-level route only after the independent tile path passes every promotion gate."
required = ["all_promotion_suites", "rollback_verified"]

[evaluation.retention]
wikitext_heldout_passages = 64
heldout_must_never_enter_training = true
max_relative_public_language_loss_increase = 0.02
target_relative_public_language_loss_increase = 0.0025

[evaluation.benchmarks]
canary = ["arc_easy"]
protected = [
  "arc_easy",
  "arc_challenge",
  "hellaswag",
  "piqa",
  "boolq",
  "openbookqa",
  "mmlu",
  "gsm8k",
  "humaneval",
]
report_every_candidate = true

[evaluation.performance]
wall_clock_must_not_regress = true
single_stream_tokens_per_second_must_not_regress = true
aggregate_tokens_per_second_must_not_regress = true
hbm_bytes_per_token_must_not_regress = true
record_active_parameters_per_token = true
record_gpu_utilization = true
record_hbm_bandwidth_utilization = true

[rejection]
reject_if_only_mathematical_sparsity_improves = true
reject_if_real_latency_worsens = true
reject_if_any_protected_capability_has_unexplained_regression = true
fallback = "retain_original_deepseek_v4_moe"
