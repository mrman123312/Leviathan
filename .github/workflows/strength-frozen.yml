name: strength-frozen
on:
  push:
    branches: [strength-arc-agi]
  pull_request:
    paths: ['src/leviathan/strength/**', 'tests/test_strength*', 'scripts/*strength*', '.github/workflows/strength-frozen.yml']
permissions:
  contents: write
concurrency:
  group: strength-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve source transport before validating
        uses: actions/upload-artifact@v4
        with:
          name: received-strength-source-${{ github.sha }}
          path: research/strength-source/
          if-no-files-found: ignore
          retention-days: 3
      - name: Materialize only the exact locally tested source
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path('research/strength-source')
          if root.exists():
              repair=json.loads((root/'repair.json').read_text()) if (root/'repair.json').exists() else {}
              chunks=[]
              for i in range(4):
                  name=f'part{i}.b64';text=(root/name).read_text()
                  if name in repair:
                      fix=repair[name]
                      assert hashlib.sha256(text.encode()).hexdigest()==fix['received_sha256'],name
                      for start,end,replacement in sorted(fix['edits'],reverse=True):
                          text=text[:start]+replacement+text[end:]
                      assert hashlib.sha256(text.encode()).hexdigest()==fix['corrected_sha256'],name
                  chunks.append(text)
              blob=base64.b64decode(''.join(chunks),validate=True)
              expected='d3cf7a2470ab167bd04b8a7dca23042826e66abe3610920c5999e66a23d95db1'
              actual=hashlib.sha256(blob).hexdigest()
              assert actual==expected,f'Source transport hash mismatch: {actual}'
              files=json.loads(gzip.decompress(blob))
              assert len(files)==27
              exact={'README_STRENGTH.md','RUN_ARC_AGI_1.bat','RUN_ARC_AGI_1_FULL.bat','docs/25-strength-arc-agi.md','spec/strength-arc.toml','scripts/check_strength_native.py','scripts/export_strength_data.py','scripts/run_strength_arc.py'}
              hashes={}
              for name,content in files.items():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name in exact or name.startswith('src/leviathan/strength/') or name.startswith('tests/test_strength_')
                  dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True)
                  raw=content.encode('utf-8');dest.write_bytes(raw);hashes[name]=hashlib.sha256(raw).hexdigest()
              evidence=pathlib.Path('evidence/strength');evidence.mkdir(parents=True,exist_ok=True)
              (evidence/'source-manifest.json').write_text(json.dumps({'archive_sha256':expected,'source_sha256':hashes},indent=2))
              print('Verified and materialized',len(files),'source files.')
          else:
              print('Normal source checkout; no transport capsule present.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install correctness dependencies, no pretrained weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install -e . 'transformers==5.8.1' numpy
      - name: Full regression and native Qwen integration
        run: |
          set -o pipefail
          mkdir -p evidence/strength
          python -m compileall -q src/leviathan/strength scripts/check_strength_native.py scripts/run_strength_arc.py
          python scripts/validate_model_registry.py
          python -m unittest discover -s tests -v 2>&1 | tee evidence/strength/ci-tests.txt
          python scripts/check_strength_native.py
      - uses: actions/checkout@v4
        with:
          repository: fchollet/ARC-AGI
          ref: 399030444e0ab0cc8b4e199870fb20b863846f34
          path: _arc_upstream
          persist-credentials: false
      - name: Export isolated official grid tasks and labels
        run: python scripts/export_strength_data.py --upstream _arc_upstream
      - name: Publish ordinary source files only after tests pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/strength-arc-agi'
        run: |
          if [ -d research/strength-source ]; then
            git config user.name 'Leviathan evidence bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README_STRENGTH.md RUN_ARC_AGI_1.bat RUN_ARC_AGI_1_FULL.bat docs/25-strength-arc-agi.md spec/strength-arc.toml scripts/check_strength_native.py scripts/export_strength_data.py scripts/run_strength_arc.py src/leviathan/strength tests/test_strength*.py data/arc_agi_1 evidence/strength/source-manifest.json evidence/strength/native-qwen.json evidence/strength/ci-tests.txt
            git rm -r research/strength-source
            git commit -m 'Publish hash-verified ARC strength source and native correctness evidence'
            git push origin HEAD:strength-arc-agi
          fi
          git rev-parse HEAD > evidence/strength/tested-published-commit.txt
      - name: Package tested source for local verification
        if: success()
        run: |
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('evidence/strength/tested-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ('src/leviathan/strength','tests','scripts','docs','spec','data/arc_agi_1'):
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file() and '__pycache__' not in p.parts and p.suffix not in {'.pyc'}:z.write(p,str(p))
              for name in ('README_STRENGTH.md','RUN_ARC_AGI_1.bat','RUN_ARC_AGI_1_FULL.bat'):z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strength-evidence-${{ github.sha }}
          path: evidence/strength/
          if-no-files-found: ignore
          retention-days: 14
