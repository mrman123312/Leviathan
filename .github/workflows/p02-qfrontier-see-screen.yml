name: P02 Q-frontier SEE screen

on:
  push:
    branches: [agent/p02-qfrontier-see-screen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 3404fa2ea9b4fe75236e2584be9da3416e646ec2, path: p01, fetch-depth: 1}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: official-stockfish/Stockfish, ref: 5062aee519a1ba262d472d8ab139851ced56573e, path: oracle, fetch-depth: 1}
      - run: python3 -m pip install --disable-pip-version-check 'python-chess>=1.999,<2'

      - name: Build baseline and oracle
        run: |
          (cd p01/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish p01.bin) &
          A=$!
          (cd oracle/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish oracle.bin) &
          B=$!
          wait $A
          wait $B

      - name: Clone built P01 and apply late-capture SEE variants
        run: |
          cp -a p01 q5see0
          cp -a p01 q6see0
          cp -a p01 q6see64
          python3 - <<'PY'
          from pathlib import Path
          needle='if (moveCount > 4 || (moveCount > 2 && leviathanCaptureCeiling < alpha - 48))'
          specs={
            'q5see0':[
              'if (moveCount > 5',
              '    || (moveCount == 5 && (leviathanCaptureCeiling < alpha + 64 || !pos.see_ge(move, 0)))',
              '    || (moveCount > 2 && moveCount <= 4',
              '        && leviathanCaptureCeiling < alpha - 48))'],
            'q6see0':[
              'if (moveCount > 6',
              '    || (moveCount > 4 && (leviathanCaptureCeiling < alpha + 96 || !pos.see_ge(move, 0)))',
              '    || (moveCount > 2 && moveCount <= 4',
              '        && leviathanCaptureCeiling < alpha - 48))'],
            'q6see64':[
              'if (moveCount > 6',
              '    || (moveCount > 4 && (leviathanCaptureCeiling < alpha + 96 || !pos.see_ge(move, 64)))',
              '    || (moveCount > 2 && moveCount <= 4',
              '        && leviathanCaptureCeiling < alpha - 48))'],
          }
          for root,repl0 in specs.items():
              p=Path(root,'src/search.cpp'); lines=p.read_text().splitlines()
              hits=[i for i,l in enumerate(lines) if needle in l]
              if len(hits)!=1: raise SystemExit(f'{root}: gate count={len(hits)}')
              i=hits[0]
              if lines[i+1].strip()!='continue;': raise SystemExit(f'{root}: malformed gate')
              ind=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              repl=[ind+x for x in repl0]+[ind+'    continue;']
              lines[i:i+2]=repl
              p.write_text('\n'.join(lines)+'\n')
          PY
          for d in q5see0 q6see0 q6see64; do
            git -C "$d" diff --check
            (cd "$d/src" && make -j2 ARCH=x86-64-avx2 build && mv stockfish "${d}.bin")
          done

      - name: Fixed development panel
        run: |
          mkdir results
          cat > results/fens.txt <<'EOF'
          rn1qk1nr/pp2bpp1/2p1p2p/3p1b2/2PP4/P1N2NP1/1P2PP1P/R1BQKB1R w KQkq - 2 7
          r1b2rk1/1pqpbpp1/2p2nnp/p3p3/2P1P3/P2PB2P/1PBNNPP1/R2QK2R w KQ - 2 13
          rnbqk2r/pp2b3/2p1pn2/3p1pp1/2PP4/1P1NP1p1/PB1N1P1P/R2QKB1R w KQkq - 0 11
          r1bq1r1k/4bppp/2p1p3/1P1p4/p2Pn3/PnN1PN1P/1P1BBPP1/2RQK2R w K - 0 15
          rnb1k1nr/1pq1bppp/2p1p3/p2p4/2PP4/3BP3/PPQN1PPP/R1B1K1NR w KQkq - 2 7
          r1bqkb1r/1ppnpp2/3p1npp/p2P4/8/4PNB1/PPP2PPP/RN1QKB1R w KQkq - 0 9
          r1bk3r/2ppqpp1/ppnb1n1p/4p3/4P3/PP1B1N1P/2PPQPP1/RNB1K2R w K - 1 11
          rnbq1rk1/pp3pp1/3ppn1p/b1p5/2PP4/1QN1PN1P/PP1BBPP1/2R1K2R w K - 2 11
          r1b1k2r/1pqnnpp1/2p1pb1p/p2p4/P1PP4/1P2PN1P/1B1NBPP1/R1Q2RK1 w k - 2 13
          r1b1kn1r/ppq1b1p1/2p2n1p/4p3/2P1p3/2N4P/PP2BPPN/R1BQ1RK1 w kq - 2 13
          r1bqkb1r/ppp1npp1/3ppn1p/8/3PP3/2P2N2/PPB2PPP/RNBQK2R w KQkq - 0 7
          r1bqk2r/pp1pb1pp/2n1pn2/2P2p2/2P5/2N1BN2/PP2PPPP/R2QKB1R w KQkq - 2 7
          1nb1k2r/2r1q2p/p1pbpn2/1p1p1pp1/PP1P1N2/2P1P1P1/1BQNBP1P/R3K2R w KQk - 0 15
          r1bqkb1r/1pp1n1pp/2n2p1B/p2p4/3pP3/2P2N2/PP2QPPP/RN2KB1R w KQkq - 0 9
          r4rk1/1p2nppp/p1nq1b2/P1pb2N1/7P/2PP4/1P2NPP1/R1BQKB1R w KQ - 3 13
          1r1q1rk1/1p2bp1p/2ppbnp1/p3p3/P1P1P3/2N1B2P/1PB1QPP1/R4RK1 w - - 0 15
          r1b1kb1r/ppq1n1p1/4p3/1Pp3N1/P2pp1Pp/3Pn2P/2PB1PB1/R2QK1NR w KQkq - 1 15
          r2q1rk1/1p3ppp/1bp5/p2nnb2/N3p2P/PQ1PP1P1/1P1B1P2/2R1KBNR w K - 1 15
          r1bq1rk1/pp2nppp/n1p1pb2/3p4/2PN4/1P2P2P/PB1P1PP1/RNQ1KB1R w KQ - 7 9
          r2qkbnr/pppbnp2/3pp2p/6pP/1PPP4/2N2N2/P3PPP1/1RBQKB1R w Kkq - 1 9
          1rbqkb1r/1pp1pp2/p3n1p1/3pP2p/2P4P/N2Q2P1/PP2nPB1/R1B1K2R w KQk - 0 15
          r2qkbnr/pp1bpp1p/3p2p1/1Bp5/3nPP2/2N2N2/PPPP2PP/R1BQ1RK1 w kq - 4 7
          2rqk2r/p2n1pp1/bppbpn1p/3p4/1PPP4/P2BPN2/2QN1PPP/R1B1K2R w KQk - 0 11
          rn2k2r/pp1bppbp/1q1p1np1/8/Q7/2N1PN2/PP2BPPP/R1B1K2R w KQkq - 6 11
          r1bqk2r/1p1n2pp/p1pbp2n/3p1p2/3P4/P1NBPN1P/1PPB1PP1/R2QK2R w KQkq - 0 9
          r1b1kb1r/ppqnppp1/2p2n1p/3p4/P3P3/3P1N2/1PPNBPPP/R1BQK2R w KQkq - 0 7
          1r1qr1k1/1b2bpp1/ppn1pn1p/8/2p5/1PN1PN1P/P2QBPP1/BR2K2R w K - 0 15
          rnb1k2r/2qnbpp1/p3p2p/2PpN3/Q7/2N1P3/PP2BPPP/R1B2RK1 w kq - 1 13
          r1bqk2r/1p3ppp/2p2n2/p2pN3/1bPP4/1QN5/PP2PPPP/R3KB1R w KQkq - 0 9
          3rr1k1/1pqnbpp1/2n1b2p/pBPpp3/8/BPP1PN1P/P2NQPP1/R3R1K1 w - - 4 15
          r2qr1k1/1b1pnpp1/pp2pn2/2p4p/2PP3P/P2QP1NR/1P2BPP1/R1B1K3 w Q - 3 15
          r1b1kb1r/2q1ppp1/ppnp1n1p/2p5/Q1P2B2/2NP1NP1/PP2PP1P/R3KB1R w KQkq - 0 9
          EOF
          sed -i 's/^          //' results/fens.txt
          cat > results/screen.py <<'PY'
          import json,random,statistics,time
          from pathlib import Path
          import chess,chess.engine
          MOVE=100000; ORACLE=900000; GRADE=300000
          paths={'p01':'p01/src/p01.bin','q5see0':'q5see0/src/q5see0.bin','q6see0':'q6see0/src/q6see0.bin','q6see64':'q6see64/src/q6see64.bin'}
          def cfg(e):
            o={}
            if 'Threads' in e.options:o['Threads']=1
            if 'Hash' in e.options:o['Hash']=64
            if 'Leviathan Fundamentals' in e.options:o['Leviathan Fundamentals']=True
            if 'Leviathan Fundamentals Authority' in e.options:o['Leviathan Fundamentals Authority']=1
            if 'Leviathan Quiet Overdrive' in e.options:o['Leviathan Quiet Overdrive']=0
            for n in ['Leviathan Risk','Leviathan Policy','Leviathan MetaSearch','Leviathan Specialist','Leviathan Atlas','Leviathan Search DSL']:
              if n in e.options:o[n]=False
            if o:e.configure(o)
          def cp(i,c):
            s=i.get('score');return None if s is None else s.pov(c).score(mate_score=100000)
          def boot(v,r,B=4000):
            a=[];n=len(v)
            for _ in range(B):a.append(sum(v[r.randrange(n)] for _ in range(n))/n)
            a.sort();return [a[int(.025*B)],a[int(.975*B)-1]]
          E={k:chess.engine.SimpleEngine.popen_uci(v) for k,v in paths.items()};O=chess.engine.SimpleEngine.popen_uci('oracle/src/oracle.bin')
          for e in E.values():cfg(e)
          O.configure({'Threads':1,'Hash':128}); rows=[]
          try:
            for i,e in enumerate([*E.values(),O]):e.analyse(chess.Board(),chess.engine.Limit(nodes=10000),game=('warm',i))
            for i,fen in enumerate(Path('results/fens.txt').read_text().splitlines()):
              b=chess.Board(fen);c=b.turn;oi=O.analyse(b,chess.engine.Limit(nodes=ORACLE),game=('o',i));os=cp(oi,c);row={'fen':fen,'oracle':os};order=list(E);order=order if i%2==0 else list(reversed(order))
              picks={}
              for k in order:
                t=time.perf_counter();z=E[k].play(b,chess.engine.Limit(nodes=MOVE),info=chess.engine.INFO_ALL,game=(k,i));picks[k]=(z.move,(time.perf_counter()-t)*1000)
              for k in E:
                m,ms=picks[k];g=cp(O.analyse(b,chess.engine.Limit(nodes=GRADE),root_moves=[m],game=('g',k,i)),c);row[k]={'move':str(m),'regret':max(0,os-g),'ms':ms}
              rows.append(row);print('tested',i+1,flush=True)
            base=[x['p01']['regret'] for x in rows];R={'positions':len(rows),'p01_mean_regret_cp':statistics.mean(base),'candidates':{}};rng=random.Random(8910)
            for k in ['q5see0','q6see0','q6see64']:
              v=[x['p01']['regret']-x[k]['regret'] for x in rows];s=sorted(v);R['candidates'][k]={'mean_regret_cp':statistics.mean(x[k]['regret'] for x in rows),'mean_improvement_vs_p01_cp':statistics.mean(v),'trimmed_mean_improvement_cp':statistics.mean(s[2:-2]),'bootstrap95':boot(v,rng),'better':sum(x>0 for x in v),'tie':sum(x==0 for x in v),'worse':sum(x<0 for x in v),'largest_rescue_cp':max(v),'largest_harm_cp':min(v),'median_time_ratio':statistics.median(x[k]['ms']/x['p01']['ms'] for x in rows)}
            Path('results/rows.json').write_text(json.dumps(rows,indent=2));Path('results/summary.json').write_text(json.dumps(R,indent=2));print(json.dumps(R,indent=2))
          finally:
            for e in E.values():e.quit()
            O.quit()
          PY
          python3 results/screen.py

      - uses: actions/upload-artifact@v4
        with: {name: 'p02-qfrontier-see-${{ github.sha }}', path: 'results/'}
