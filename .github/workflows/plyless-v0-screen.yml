name: Leviathan plyless v0 decision-depth screen

on:
  push:
    branches: [leviathan/plyless-v0-decision-depth]
    paths: ['.github/workflows/plyless-v0-screen.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  screen:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [control, check4, check8, all2, adaptive]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d, path: leviathan}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: official-stockfish/Stockfish, ref: 5062aee519a1ba262d472d8ab139851ced56573e, path: stockfish}

      - name: Apply decision-depth compression
        if: matrix.profile != 'control'
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          q=os.environ['PROFILE']
          p=Path('src/search.cpp'); s=p.read_text()

          a='''    bool  capture, ttCapture;\n    int   priorReduction;'''
          b='''    bool  capture, ttCapture;\n    bool  leviathanForcedCorridor = false;\n    int   priorReduction;'''
          if s.count(a)!=1: raise SystemExit('declaration anchor')
          s=s.replace(a,b,1)

          # Detect only after Stockfish's ordinary pruning/TT work has failed to settle
          # the node. This keeps the legal-move count off the common early-cutoff path.
          a='''moves_loop:  // When in check, search starts here\n\n    // Step 12. A small Probcut idea'''
          if q=='check4': cond='ss->inCheck && depth <= 4'
          elif q=='check8': cond='ss->inCheck && depth <= 8'
          elif q=='all2': cond='depth <= 2'
          elif q=='adaptive': cond='(ss->inCheck ? depth <= 8 : depth <= 2)'
          else: raise SystemExit(q)
          b=f'''moves_loop:  // When in check, search starts here\n\n    // Leviathan Plyless v0: depth measures decisions, not merely elapsed moves.\n    // A node with exactly one legal move has branching factor one, so charging a\n    // complete decision ply there wastes horizon without resolving uncertainty.\n    // We still search the move normally; no move is pruned or assumed correct.\n    if (Leviathan::Fundamentals::ready() && !rootNode && !excludedMove\n        && ss->ply < MAX_PLY - 2 && ({cond}))\n    {{\n        MoveList<LEGAL> lvLegal(pos);\n        leviathanForcedCorridor = lvLegal.size() == 1;\n    }}\n\n    // Step 12. A small Probcut idea'''
          if s.count(a)!=1: raise SystemExit('moves_loop anchor')
          s=s.replace(a,b,1)

          # Apply the compression after singular-extension logic so it composes with
          # Stockfish instead of being overwritten by later extension assignment.
          a='''        u64 nodeCount = rootNode ? u64(nodes) : 0;\n        const u64 leviathanParentKey = u64(pos.key());'''
          b='''        // A forced corridor consumes no decision depth. This is a one-ply\n        // extension in Stockfish coordinates: newDepth=(depth-1)+1 == depth.\n        if (leviathanForcedCorridor && extension < 1)\n            extension = 1;\n\n        u64 nodeCount = rootNode ? u64(nodes) : 0;\n        const u64 leviathanParentKey = u64(pos.key());'''
          if s.count(a)!=1: raise SystemExit('extension anchor')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git diff --check

      - run: python3 -m pip install --disable-pip-version-check 'python-chess>=1.999,<2'

      - name: Build equal AVX2 engines
        run: |
          cd leviathan/src && make net && make clean && make -j2 ARCH=x86-64-avx2 build && mv stockfish leviathan
          cd ../../stockfish/src && make net && make clean && make -j2 ARCH=x86-64-avx2 build && mv stockfish parent

      - name: Configure common isolated Fundamentals parent
        working-directory: leviathan
        run: |
          mkdir -p x
          cat > x/a.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":2,"Leviathan Forcing Buyback":384,"Leviathan Recapture Buyback":256,"Leviathan Passer Buyback":320,"Leviathan Endgame Buyback":128,"Leviathan Quiet Overdrive":160,"Leviathan Rule50 Pawn Bonus":3072,"Leviathan Zugzwang Guard":true,"Leviathan Sacrifice Rescue":true,"Leviathan Rule50 Pressure":true,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Risk":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF
          echo '{"Threads":1,"Hash":64}' > x/b.json

      - name: Generate common diverse 25-opening panel
        working-directory: leviathan
        run: |
          python3 - <<'PY'
          import random,chess,chess.engine
          from pathlib import Path
          sf=chess.engine.SimpleEngine.popen_uci('../stockfish/src/parent');sf.configure({'Threads':1,'Hash':64})
          out=[];seen=set()
          try:
            for family in range(5):
              r=random.Random(15485863+family*32452843);loc=[]
              while len(loc)<5:
                b=chess.Board()
                for _ in range(r.randint(10,22)):
                  if b.is_game_over():break
                  z=sf.analyse(b,chess.engine.Limit(nodes=1800),multipv=min(6,b.legal_moves.count()));z=z if isinstance(z,list) else [z]
                  ranked=[]
                  for i in z:
                    if i.get('pv'): ranked.append((i['pv'][0],int(i['score'].pov(b.turn).score(mate_score=100000) or 0)))
                  if not ranked:break
                  best=ranked[0][1]; viable=[x for x in ranked if best-x[1] <= 120] or ranked[:1]
                  b.push(r.choices([m for m,_ in viable],weights=range(len(viable),0,-1),k=1)[0])
                k=' '.join(b.fen().split()[:4])
                if b.is_game_over() or k in seen:continue
                seen.add(k);loc.append(b.fen())
              out += loc
          finally:sf.quit()
          Path('x/openings.fen').write_text('\n'.join(out)+'\n')
          PY

      - name: Exact-off containment and active bench
        working-directory: leviathan/src
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          ./leviathan bench 2>&1 | tee ../x/off-${PROFILE}.txt
          grep -q 'Nodes searched  : 2884956' ../x/off-${PROFILE}.txt
          printf 'setoption name Leviathan Fundamentals value true\nsetoption name Leviathan Fundamentals Authority value 2\nbench\nquit\n' | ./leviathan 2>&1 | tee ../x/on-${PROFILE}.txt

      - name: 50 equal-node games
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 tools/run_match.py --engine-a "$PWD/src/leviathan" --engine-b "$GITHUB_WORKSPACE/stockfish/src/parent" --options-a x/a.json --options-b x/b.json --openings x/openings.fen --games 50 --nodes-per-move 22000 --max-plies 246 --out x/nodes-${PROFILE}.json

      - name: 50 fixed-time games
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 tools/run_match.py --engine-a "$PWD/src/leviathan" --engine-b "$GITHUB_WORKSPACE/stockfish/src/parent" --options-a x/a.json --options-b x/b.json --openings x/openings.fen --games 50 --movetime-ms 100 --max-plies 246 --out x/time-${PROFILE}.json

      - name: Measure useful horizon at equal nodes
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 - <<'PY'
          import chess,chess.engine,json,os,statistics
          fens=[x.strip() for x in open('x/openings.fen') if x.strip()]
          def panel(path,options):
            e=chess.engine.SimpleEngine.popen_uci(path);e.configure(options); rows=[]
            try:
              for fen in fens:
                b=chess.Board(fen);r=e.analyse(b,chess.engine.Limit(nodes=40000));
                rows.append({'depth':r.get('depth',0),'seldepth':r.get('seldepth',0),'pv_len':len(r.get('pv',[]))})
            finally:e.quit()
            return rows
          a=panel('./src/leviathan',json.load(open('x/a.json')))
          b=panel('../stockfish/src/parent',json.load(open('x/b.json')))
          R={'profile':os.environ['PROFILE'],'candidate':a,'parent':b,
             'candidate_median_seldepth':statistics.median(x['seldepth'] for x in a),
             'parent_median_seldepth':statistics.median(x['seldepth'] for x in b),
             'candidate_mean_seldepth':statistics.mean(x['seldepth'] for x in a),
             'parent_mean_seldepth':statistics.mean(x['seldepth'] for x in b)}
          open(f'x/horizon-{os.environ["PROFILE"]}.json','w').write(json.dumps(R,indent=2)+'\n')
          print(json.dumps({k:v for k,v in R.items() if not isinstance(v,list)},indent=2))
          PY

      - name: Summarize
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          q=os.environ['PROFILE'];n=json.load(open(f'x/nodes-{q}.json'))['summary'];t=json.load(open(f'x/time-{q}.json'))['summary'];h=json.load(open(f'x/horizon-{q}.json'));off=Path(f'x/off-{q}.txt').read_text();on=Path(f'x/on-{q}.txt').read_text();g=lambda p,s:int(re.findall(p,s)[-1]);R={'profile':q,'equal_node':n,'fixed_time':t,'active_bench_nodes':g(r'Nodes searched\s*:\s*(\d+)',on),'active_bench_ms':g(r'Total time \(ms\)\s*:\s*(\d+)',on),'off_bench_ms':g(r'Total time \(ms\)\s*:\s*(\d+)',off),'candidate_mean_seldepth':h['candidate_mean_seldepth'],'parent_mean_seldepth':h['parent_mean_seldepth']};Path(f'x/report-{q}.json').write_text(json.dumps(R,indent=2)+'\n');print(json.dumps(R,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: plyless-v0-${{ matrix.profile }}
          path: |
            leviathan/x/report-${{ matrix.profile }}.json
            leviathan/x/horizon-${{ matrix.profile }}.json
            leviathan/x/nodes-${{ matrix.profile }}.json
            leviathan/x/time-${{ matrix.profile }}.json
