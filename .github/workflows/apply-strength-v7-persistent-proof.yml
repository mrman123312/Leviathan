name: Apply strength v7 persistent proof memory

on:
  push:
    branches:
      - leviathan/strength-v7-persistent-proof
    paths:
      - '.github/workflows/apply-strength-v7-persistent-proof.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength v7
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v7-persistent-proof

      - name: Add persistent proof memory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hp = Path('src/search.h')
          h = hp.read_text()
          old_h = "    PVMoves lastIterationIdxPV;\n\n    usize                     threadIdx, numaThreadIdx, numaTotal;\n"
          new_h = "    PVMoves lastIterationIdxPV;\n\n    // Leviathan strength v7 - Persistent Proof Memory. This stores only the\n    // epistemic warning that search shortcuts were unreliable at a position;\n    // it never stores a move or evaluation as truth. Per-worker ownership keeps\n    // it lock-free, and the cache survives consecutive go commands in one game.\n    struct LeviathanProofMemoryEntry {\n        Key          key  = 0;\n        unsigned int debt = 0;\n    };\n    static constexpr usize LEVIATHAN_PROOF_MEMORY_SIZE = 4096;\n    std::array<LeviathanProofMemoryEntry, LEVIATHAN_PROOF_MEMORY_SIZE> leviathanProofMemory{};\n    int leviathanLastRootGamePly = -1;\n\n    unsigned int leviathan_proof_memory_load(Key key) const {\n        const auto& e = leviathanProofMemory[usize(key) & (LEVIATHAN_PROOF_MEMORY_SIZE - 1)];\n        return e.key == key ? e.debt : 0;\n    }\n\n    void leviathan_proof_memory_store(Key key, int debt) {\n        if (debt < 3)\n            return;\n        auto& e = leviathanProofMemory[usize(key) & (LEVIATHAN_PROOF_MEMORY_SIZE - 1)];\n        if (e.key != key)\n            e = {key, unsigned(std::min(debt, 5))};\n        else\n            e.debt = std::max(e.debt, unsigned(std::min(debt, 5)));\n    }\n\n    void leviathan_proof_memory_reset() {\n        leviathanProofMemory.fill({});\n    }\n\n    usize                     threadIdx, numaThreadIdx, numaTotal;\n"
          if h.count(old_h) != 1:
              raise SystemExit(f'header memory anchor count {h.count(old_h)}')
          hp.write_text(h.replace(old_h, new_h, 1))
          sp = Path('src/search.cpp')
          s = sp.read_text()
          old_start = "void Search::Worker::start_searching() {\n\n    accumulatorStack.reset();\n"
          new_start = "void Search::Worker::start_searching() {\n\n    accumulatorStack.reset();\n\n    // Persist proof warnings while the actual game advances, but never leak\n    // them into a new game, a takeback, or repeated analysis of the same root.\n    const int leviathanRootGamePly = rootPos.game_ply();\n    if (leviathanLastRootGamePly >= 0 && leviathanRootGamePly <= leviathanLastRootGamePly)\n        leviathan_proof_memory_reset();\n    leviathanLastRootGamePly = leviathanRootGamePly;\n"
          if s.count(old_start) != 1:
              raise SystemExit(f'start memory anchor count {s.count(old_start)}')
          s = s.replace(old_start, new_start, 1)
          old_load = "    excludedMove                   = ss->excludedMove;\n    posKey                         = leviathan_tt_key(pos);\n    auto [ttHit, ttData, ttWriter] = tt.probe(posKey);\n"
          new_load = "    excludedMove                   = ss->excludedMove;\n    posKey                         = leviathan_tt_key(pos);\n    // If this worker already discovered that heuristics disagree here, begin\n    // the revisit with that proof debt instead of paying to rediscover it.\n    leviathanProofDebt = std::max(leviathanProofDebt,\n                                  int(leviathan_proof_memory_load(posKey)));\n    auto [ttHit, ttData, ttWriter] = tt.probe(posKey);\n"
          if s.count(old_load) != 1:
              raise SystemExit(f'load memory anchor count {s.count(old_load)}')
          s = s.replace(old_load, new_load, 1)
          old_store = "    // Write gathered information in transposition table. Note that the\n    // static evaluation is saved as it was before correction history.\n    if (!excludedMove && !(rootNode && pvIdx))\n"
          new_store = "    // Persist only substantial proof debt. This is deliberately separate\n    // from TT score authority: future visits inherit skepticism, not a verdict.\n    if (!excludedMove && leviathanProofDebt >= 3)\n        leviathan_proof_memory_store(posKey, leviathanProofDebt);\n\n    // Write gathered information in transposition table. Note that the\n    // static evaluation is saved as it was before correction history.\n    if (!excludedMove && !(rootNode && pvIdx))\n"
          if s.count(old_store) != 1:
              raise SystemExit(f'store memory anchor count {s.count(old_store)}')
          sp.write_text(s.replace(old_store, new_store, 1))
          PY
          git diff --check
          git diff -- src/search.h src/search.cpp

      - name: Commit persistent proof memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.h src/search.cpp
          git commit -m 'Strength v7: persist proof debt across game moves'
          git push origin HEAD:leviathan/strength-v7-persistent-proof
