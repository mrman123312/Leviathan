name: P09 Static Champion Screen

on:
  push:
    branches: [agent/p09-static-champion-screen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless-speed:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact P03 candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: cand
          fetch-depth: 1

      - name: Checkout exact P03 control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: base
          fetch-depth: 1

      - name: Checkout benchmark harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/fundamentals-ultra-lab
          path: harness
          fetch-depth: 1

      - name: Materialize fixed champion configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cand/src/leviathan_fundamentals.h'); s=p.read_text()
          old="inline bool ready() {\n    const State& cfg = state();\n    return cfg.enabled && cfg.authority > 0;\n}"
          new="inline constexpr bool ready() { return true; }"
          if s.count(old)!=1: raise SystemExit('ready anchor mismatch')
          s=s.replace(old,new,1)

          old="inline bool zugzwang_risk(const Position& pos) {\n    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0 || !cfg.zugzwangGuard)\n        return false;\n\n    // Conservative detector: sparse positions with very little non-pawn\n    // mobility are where null-move assumptions are structurally least safe.\n    return pos.count<ALL_PIECES>() <= 9 && non_pawn_count(pos) <= 2;\n}"
          new="inline bool zugzwang_risk(const Position& pos) {\n    // Champion profile: Fundamentals and the zugzwang guard are always on.\n    return pos.count<ALL_PIECES>() <= 9 && non_pawn_count(pos) <= 2;\n}"
          if s.count(old)!=1: raise SystemExit('zugzwang anchor mismatch')
          s=s.replace(old,new,1)

          old="    if (!ready() || !state().sacrificeRescue)\n        return false;\n\n"
          if s.count(old)!=1: raise SystemExit('rescue readiness anchor mismatch')
          s=s.replace(old,"",1)

          old="    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0)\n        return 0;\n\n"
          if s.count(old)!=1: raise SystemExit('lmr readiness anchor mismatch')
          s=s.replace(old,"",1)
          s=s.replace('delta -= cfg.forcingBuyback;', 'delta -= 384;', 1)
          s=s.replace('delta -= cfg.recaptureBuyback;', 'delta -= 256;', 1)
          s=s.replace('delta -= cfg.passerBuyback;', 'delta -= 320;', 1)
          s=s.replace('delta -= cfg.endgameBuyback;', 'delta -= 128;', 1)

          start="    // Authority 2 is the funding mechanism. v2.1 deliberately avoids\n"
          end="        delta += cfg.quietOverdrive * lateness * depthScale / 48;\n    }\n\n"
          i=s.find(start)
          if i<0: raise SystemExit('authority2 start missing')
          j=s.find(end,i)
          if j<0: raise SystemExit('authority2 end missing')
          j += len(end)
          s=s[:i] + "    // Champion profile is Authority 1: the Authority-2 overdrive path is compiled out.\n\n" + s[j:]

          old="inline int quiet_ordering_bonus(const Position& pos, Move move) {\n    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0 || !cfg.rule50Pressure || pos.rule50_count() < 70)\n        return 0;\n\n    // Captures are scored in another MovePicker stage. Push pawn moves upward\n    // when the fifty-move counter is dangerous because they reset it.\n    return pawn_move(pos, move) ? cfg.rule50PawnBonus : 0;\n}"
          new="inline int quiet_ordering_bonus(const Position& pos, Move move) {\n    if (pos.rule50_count() < 70)\n        return 0;\n    return pawn_move(pos, move) ? 3072 : 0;\n}"
          if s.count(old)!=1: raise SystemExit('rule50 anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('cand/src/movepick.cpp'); s=p.read_text()
          old="    const bool leviathanRule50Ready = Type == QUIETS && Leviathan::Fundamentals::ready()\n                                      && Leviathan::Fundamentals::state().rule50Pressure\n                                      && pos.rule50_count() >= 70;"
          new="    const bool leviathanRule50Ready = Type == QUIETS && pos.rule50_count() >= 70;"
          if s.count(old)!=1: raise SystemExit('movepick rule50 anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          git -C cand diff --check
          git -C cand diff -- src/leviathan_fundamentals.h src/movepick.cpp

      - name: Build P03 controls and static champion
        run: |
          make -C base/src net
          make -C base/src clean
          make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C cand/src clean
          make -C cand/src -j2 ARCH=x86-64-avx2 build
          cat > active.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Risk":false,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF

      - name: Exact behavior and calibrated speed screen
        run: |
          python3 harness/tools/lossless_pair_benchmark.py \
            --control-a base/src/control_a \
            --control-b base/src/control_b \
            --candidate cand/src/stockfish \
            --options active.json \
            --rounds 31 \
            --output p09-static-champion.json | tee p09-static-champion.log

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('p09-static-champion.json')); sig=d['signatures']; r=d['results']; exact=True
          for case in ('default','depth11','nodes50k'):
              a=sig['control_a'][case]; c=sig['candidate'][case]
              exact &= a['nodes']==c['nodes'] and a['behavior_sha256']==c['behavior_sha256']
          c=r['candidate']; a=r['control_b']
          out={'exact_champion_behavior':exact,'aa_median':a['median_speedup'],'aa_ci':a['bootstrap_median_95pct_ci'],'candidate_median':c['median_speedup'],'candidate_geo':c['geometric_mean_speedup'],'candidate_ci':c['bootstrap_median_95pct_ci'],'faster_rounds':c['faster_rounds'],'rounds':c['rounds']}
          open('p09-summary.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          if not exact: raise SystemExit('BEHAVIOR_MISMATCH')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p09-static-champion-${{ github.sha }}
          path: |
            p09-static-champion.json
            p09-static-champion.log
            p09-summary.json
          retention-days: 30
