name: Exact rule50-aware evaluation-cache profiler
on:
  push:
    branches: [leviathan/speed-v3-profile]
    paths: ['.github/workflows/eval-cache-potential-exact.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: official-stockfish/Stockfish, ref: 5062aee519a1ba262d472d8ab139851ced56573e}
      - name: Instrument exact evaluation context reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/search.cpp');s=p.read_text();s=s.replace('#include <vector>','#include <vector>\n#include <array>\n#include <iostream>')
          a='''Value Search::Worker::evaluate(const Position& pos) {\n    return Eval::evaluate(network[numaAccessToken], pos, accumulatorStack, refreshTable,\n                          optimism[pos.side_to_move()]);\n}'''
          b='''Value Search::Worker::evaluate(const Position& pos) {\n    struct P {\n      std::array<u64,1ULL<<12> a{}; std::array<u64,1ULL<<14> b{};\n      std::array<u64,1ULL<<16> c{}; std::array<u64,1ULL<<18> d{};\n      u64 calls=0,h12=0,h14=0,h16=0,h18=0;\n      ~P(){std::cerr<<"LVEXACT calls "<<calls<<" h12 "<<h12<<" h14 "<<h14<<" h16 "<<h16<<" h18 "<<h18<<'\\n';}\n    };\n    static thread_local P p;\n    const u64 opt=u64(u32(optimism[pos.side_to_move()]));\n    const u64 r50=u64(u32(pos.rule50_count()));\n    u64 k=u64(pos.key()) ^ (opt*0x9E3779B97F4A7C15ULL) ^ (r50*0xD6E8FEB86659FD93ULL);\n    if(!k)k=1;++p.calls;\n    auto touch=[&](auto& tab,int bits,u64& hits){usize i=(k^(k>>29)^(k>>47))&((1ULL<<bits)-1);hits+=tab[i]==k;tab[i]=k;};\n    touch(p.a,12,p.h12);touch(p.b,14,p.h14);touch(p.c,16,p.h16);touch(p.d,18,p.h18);\n    return Eval::evaluate(network[numaAccessToken], pos, accumulatorStack, refreshTable, optimism[pos.side_to_move()]);\n}'''
          if s.count(a)!=1: raise SystemExit('anchor')
          p.write_text(s.replace(a,b,1))
          PY
      - name: Build and run
        working-directory: src
        run: |
          make net && make clean && make -j2 ARCH=x86-64-avx2 build
          ./stockfish bench 2>&1 | tee ../exact-eval-reuse.txt
          grep '^LVEXACT' ../exact-eval-reuse.txt
      - uses: actions/upload-artifact@v4
        with: {name: exact-eval-reuse, path: exact-eval-reuse.txt}
