name: Fundamentals Ultra Authority2 Confirmation

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-authority2.yml']

permissions: {contents: read}

jobs:
  authority2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-v2.1.1-phasefix, path: engine}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-lab, path: lab}
      - name: Build phase-fix and Stockfish
        run: |
          make -C engine/src net && make -C engine/src clean && make -C engine/src -j2 ARCH=x86-64-avx2 build
          cp engine/src/stockfish engine/src/authority1
          cp engine/src/stockfish engine/src/authority2
          git clone https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Recreate exact corpus
        run: |
          python3 lab/tools/generate_balanced_openings.py --stockfish "$RUNNER_TEMP/sf/src/stockfish" --output openings.json --count 50 --plies 8 --seed 8910 --max-abs-cp 80
          test "$(sha256sum openings.json | cut -d' ' -f1)" = '444b13d062e5aa38e72f6ffc5a2f3aa8daf92d4b6712a2d40646c857b51795da'
      - name: Write authority-specific controller
        run: |
          python3 - <<'PY'
          p='lab/tools/fundamentals_tournament.py'
          s=open(p).read()
          s=s.replace('ap.add_argument("--candidate-fundamentals",action="store_true")','ap.add_argument("--candidate-fundamentals",action="store_true");ap.add_argument("--candidate-authority",type=int,default=1)')
          s=s.replace('ap.add_argument("--opponent-fundamentals",action="store_true")','ap.add_argument("--opponent-fundamentals",action="store_true");ap.add_argument("--opponent-authority",type=int,default=1)')
          s=s.replace('def configure(e,fundamentals):','def configure(e,fundamentals,authority=1):')
          s=s.replace('(\"Leviathan Fundamentals Authority\",1)', '("Leviathan Fundamentals Authority",authority)')
          s=s.replace('co=configure(cand,a.candidate_fundamentals);oo=configure(opp,a.opponent_fundamentals)', 'co=configure(cand,a.candidate_fundamentals,a.candidate_authority);oo=configure(opp,a.opponent_fundamentals,a.opponent_authority)')
          open('authority_tournament.py','w').write(s)
          PY
      - name: 100-game equal-time Authority2 vs Authority1
        run: |
          mkdir -p time
          python3 authority_tournament.py --candidate "$PWD/engine/src/authority2" --opponent "$PWD/engine/src/authority1" --candidate-label phasefix-authority2 --opponent-label phasefix-authority1 --candidate-fundamentals --opponent-fundamentals --candidate-authority 2 --opponent-authority 1 --move-time-ms 100 --openings-json openings.json --max-plies 180 --output-dir time | tee time/match.log
      - name: 100-game equal-node Authority2 vs Authority1
        run: |
          mkdir -p nodes
          python3 authority_tournament.py --candidate "$PWD/engine/src/authority2" --opponent "$PWD/engine/src/authority1" --candidate-label phasefix-authority2 --opponent-label phasefix-authority1 --candidate-fundamentals --opponent-fundamentals --candidate-authority 2 --opponent-authority 1 --nodes-per-move 80000 --openings-json openings.json --max-plies 180 --output-dir nodes | tee nodes/match.log
      - name: 100-game Authority2 vs Stockfish
        run: |
          mkdir -p stockfish
          python3 authority_tournament.py --candidate "$PWD/engine/src/authority2" --opponent "$RUNNER_TEMP/sf/src/stockfish" --candidate-label phasefix-authority2 --opponent-label Stockfish-5062aee5 --candidate-fundamentals --candidate-authority 2 --move-time-ms 100 --openings-json openings.json --max-plies 180 --output-dir stockfish | tee stockfish/match.log
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals-ultra-authority2
          path: |
            time
            nodes
            stockfish
            openings.json
          retention-days: 30
