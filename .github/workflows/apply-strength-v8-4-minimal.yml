name: Apply strength v8.4 causal minimal

on:
  push:
    branches:
      - leviathan/strength-v8-4-causal-minimal
    paths:
      - '.github/workflows/apply-strength-v8-4-minimal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout V8.4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v8-4-causal-minimal
      - name: Apply causal-minimal ablation
        run: |
          set -euo pipefail
          python3 tools/leviathan_apply_v8_4_minimal.py
          git diff --check
          git diff -- src/search.h src/search.cpp
      - name: Commit V8.4 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.h src/search.cpp
          git commit -m 'Strength v8.4: reduce evidence authority to causal LMR proof'
          git push origin HEAD:leviathan/strength-v8-4-causal-minimal
