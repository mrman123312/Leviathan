name: Leviathan speed v3 NNUE capture lane

on:
  push:
    branches: [leviathan/speed-v3-profile]
    paths: ['.github/workflows/speed-v3-nnue-capture.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  exact-speed:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d, path: candidate}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d, path: reference}
      - name: Specialize 1-add 2-remove PSQ skeleton
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nnue/nnue_accumulator.cpp');s=p.read_text()
          anchor='''        apply_psq_features<-1>(j, acc, psqRemoved, featureTransformer);\n        apply_psq_features<+1>(j, acc, psqAdded, featureTransformer);'''
          repl='''        if (psqAdded.ssize() == 1 && psqRemoved.ssize() == 2)\n        {\n            const usize tile = j * Tiling::TileHeight;\n            auto* rem0 = reinterpret_cast<const vec_t*>(&featureTransformer.weights[psqRemoved[0] * Dimensions + tile]);\n            auto* rem1 = reinterpret_cast<const vec_t*>(&featureTransformer.weights[psqRemoved[1] * Dimensions + tile]);\n            auto* add0 = reinterpret_cast<const vec_t*>(&featureTransformer.weights[psqAdded[0] * Dimensions + tile]);\n            for (IndexType k = 0; k < Tiling::NumRegs; ++k)\n                acc[k] = vec_add_16(vec_sub_16(vec_sub_16(acc[k], rem0[k]), rem1[k]), add0[k]);\n        }\n        else\n        {\n            apply_psq_features<-1>(j, acc, psqRemoved, featureTransformer);\n            apply_psq_features<+1>(j, acc, psqAdded, featureTransformer);\n        }'''
          if s.count(anchor)!=1:raise SystemExit('acc anchor')
          s=s.replace(anchor,repl,1)
          anchor='''        apply_psqt<-1>(j, psqt, psqRemoved, featureTransformer.psqtWeights.data());\n        apply_psqt<+1>(j, psqt, psqAdded, featureTransformer.psqtWeights.data());'''
          repl='''        if (psqAdded.ssize() == 1 && psqRemoved.ssize() == 2)\n        {\n            const usize off = j * Tiling::PsqtTileHeight;\n            auto* rem0 = reinterpret_cast<const psqt_vec_t*>(&featureTransformer.psqtWeights[psqRemoved[0] * PSQTBuckets + off]);\n            auto* rem1 = reinterpret_cast<const psqt_vec_t*>(&featureTransformer.psqtWeights[psqRemoved[1] * PSQTBuckets + off]);\n            auto* add0 = reinterpret_cast<const psqt_vec_t*>(&featureTransformer.psqtWeights[psqAdded[0] * PSQTBuckets + off]);\n            for (IndexType k = 0; k < Tiling::NumPsqtRegs; ++k)\n                psqt[k] = vec_add_psqt_32(vec_sub_psqt_32(vec_sub_psqt_32(psqt[k], rem0[k]), rem1[k]), add0[k]);\n        }\n        else\n        {\n            apply_psqt<-1>(j, psqt, psqRemoved, featureTransformer.psqtWeights.data());\n            apply_psqt<+1>(j, psqt, psqAdded, featureTransformer.psqtWeights.data());\n        }'''
          if s.count(anchor)!=1:raise SystemExit('psqt anchor')
          p.write_text(s.replace(anchor,repl,1))
          PY
      - name: Build
        run: |
          cd candidate/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish candidate
          cd ../../reference/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish reference
      - name: Exact 21-pair panel
        run: |
          python3 - <<'PY' | tee capture-lane.txt
          import json,re,statistics,subprocess
          cfg='setoption name Threads value 1\nsetoption name Hash value 64\nsetoption name Leviathan Fundamentals value true\nsetoption name Leviathan Fundamentals Authority value 2\nsetoption name Leviathan Policy value false\nsetoption name Leviathan MetaSearch value false\nsetoption name Leviathan Risk value false\nsetoption name Leviathan Specialist value false\nsetoption name Leviathan Atlas value false\nsetoption name Leviathan Search DSL value false\n'
          def R(p):
            z=subprocess.run([p],input=cfg+'bench\nquit\n',text=True,capture_output=True,check=True);o=z.stdout+z.stderr
            return {'ms':int(re.findall(r'Total time \(ms\)\s*:\s*(\d+)',o)[-1]),'nodes':int(re.findall(r'Nodes searched\s*:\s*(\d+)',o)[-1])}
          ref='./reference/src/reference';cand='./candidate/src/candidate';R(ref);R(cand);P=[]
          for i in range(21):
            if i%2:c=R(cand);r=R(ref)
            else:r=R(ref);c=R(cand)
            if r['nodes']!=c['nodes']:raise SystemExit(f'DIVERGENCE {r} {c}')
            P.append((r,c));print(i+1,r,c,r['ms']/c['ms'])
          q=[r['ms']/c['ms'] for r,c in P]
          out={'nodes':P[0][0]['nodes'],'median_speedup':statistics.median(q),'mean_speedup':statistics.mean(q),'reference_median_ms':statistics.median(r['ms'] for r,c in P),'candidate_median_ms':statistics.median(c['ms'] for r,c in P)}
          open('capture-lane.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: speed-v3-nnue-capture
          path: |
            capture-lane.json
            capture-lane.txt
