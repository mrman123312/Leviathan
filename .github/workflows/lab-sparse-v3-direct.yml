name: Leviathan sparse uncertainty v3 direct retest

on:
  push:
    branches: [leviathan/lab-v4-sparse-retest]
    paths:
      - '.github/workflows/lab-sparse-v3-direct.yml'
      - 'src/search.cpp'
      - 'tools/disagreement_oracle_v2.py'
      - 'tools/summarize_paired_match.py'
      - 'experiments/holdouts/sparse_v3_direct_seed910247.fen'
      - 'experiments/options/active_fundamentals.json'
      - 'experiments/manifests/sparse_v3_direct_retest.json'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: lab-sparse-v3-direct-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  direct-retest:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 9fe94b6c81ccf3b1defe3200d6c08098a8dba1e1
          path: reference
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: official-stockfish/Stockfish
          ref: 5062aee519a1ba262d472d8ab139851ced56573e
          path: oracle
      - name: Record immutable provenance
        run: |
          set -euo pipefail
          {
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            uname -a
            lscpu
            g++ --version
            python3 --version
            git -C candidate rev-parse HEAD
            git -C reference rev-parse HEAD
            git -C oracle rev-parse HEAD
            git -C candidate rev-parse 'HEAD^{tree}'
            git -C reference rev-parse 'HEAD^{tree}'
            sha256sum candidate/experiments/holdouts/sparse_v3_direct_seed910247.fen
            sha256sum candidate/experiments/options/active_fundamentals.json
            sha256sum candidate/experiments/manifests/sparse_v3_direct_retest.json
          } | tee provenance.txt
          set +e
          diff -ru --exclude='*.nnue' reference/src candidate/src > candidate-source.patch
          diff_status=$?
          set -e
          if (( diff_status > 1 )); then exit "$diff_status"; fi
          test -s candidate-source.patch
      - name: Install hash-locked chess harness dependency
        run: |
          set -euo pipefail
          PIP_CACHE_DIR="$RUNNER_TEMP/pip-cache" python3 -m pip install \
            --disable-pip-version-check --require-hashes \
            -r candidate/experiments/requirements-chess-hashed.txt
          python3 -m pip freeze | sort | tee dependency-freeze.txt
      - name: Build candidate, reference, and oracle
        run: |
          set -euo pipefail
          for engine in candidate reference oracle; do
            make -C "$engine/src" net
            make -C "$engine/src" -j2 ARCH=x86-64-avx2 build
            mv "$engine/src/stockfish" "$engine/src/$engine"
          done
          sha256sum candidate/src/candidate reference/src/reference oracle/src/oracle \
            | tee binary-sha256.txt
          sha256sum candidate/src/nn-ab28990d4ea3.nnue \
            reference/src/nn-ab28990d4ea3.nnue oracle/src/nn-ab28990d4ea3.nnue \
            | tee network-sha256.txt
      - name: Record active bench behavior
        run: |
          set -euo pipefail
          python3 - <<'PY' > active-bench.uci
          import json
          options=json.load(open('candidate/experiments/options/active_fundamentals.json'))
          for name,value in options.items():
              if isinstance(value,bool): value=str(value).lower()
              print(f'setoption name {name} value {value}')
          print('bench')
          print('quit')
          PY
          candidate/src/candidate < active-bench.uci 2>&1 | tee candidate-bench.txt
          reference/src/reference < active-bench.uci 2>&1 | tee reference-bench.txt
      - name: Primary 100-game direct equal-node retest
        run: |
          set -euo pipefail
          python3 candidate/tools/run_match.py \
            --engine-a "$GITHUB_WORKSPACE/candidate/src/candidate" \
            --engine-b "$GITHUB_WORKSPACE/reference/src/reference" \
            --options-a candidate/experiments/options/active_fundamentals.json \
            --options-b candidate/experiments/options/active_fundamentals.json \
            --openings candidate/experiments/holdouts/sparse_v3_direct_seed910247.fen \
            --games 100 --nodes-per-move 24000 --max-plies 240 \
            --out results/equal-node.json | tee results-equal-node.log
          python3 candidate/tools/summarize_paired_match.py \
            --input results/equal-node.json --output results/equal-node-summary.json \
            --seed 19001 | tee results-equal-node-summary.log
      - name: Secondary 100-game direct fixed-time retest
        run: |
          set -euo pipefail
          python3 candidate/tools/run_match.py \
            --engine-a "$GITHUB_WORKSPACE/candidate/src/candidate" \
            --engine-b "$GITHUB_WORKSPACE/reference/src/reference" \
            --options-a candidate/experiments/options/active_fundamentals.json \
            --options-b candidate/experiments/options/active_fundamentals.json \
            --openings candidate/experiments/holdouts/sparse_v3_direct_seed910247.fen \
            --games 100 --movetime-ms 100 --max-plies 240 \
            --out results/fixed-time.json | tee results-fixed-time.log
          python3 candidate/tools/summarize_paired_match.py \
            --input results/fixed-time.json --output results/fixed-time-summary.json \
            --seed 19002 | tee results-fixed-time-summary.log
      - name: Deep-oracle disagreement test
        run: |
          set -euo pipefail
          python3 candidate/tools/disagreement_oracle_v2.py \
            --candidate "$GITHUB_WORKSPACE/candidate/src/candidate" \
            --reference "$GITHUB_WORKSPACE/reference/src/reference" \
            --oracle "$GITHUB_WORKSPACE/oracle/src/oracle" \
            --options-candidate candidate/experiments/options/active_fundamentals.json \
            --options-reference candidate/experiments/options/active_fundamentals.json \
            --disagreements 40 --max-positions 1600 --seed 773031 \
            --shallow 24000 --deep 300000 --out results/deep-oracle.json \
            | tee results-deep-oracle.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sparse-v3-direct-retest
          retention-days: 90
          path: |
            provenance.txt
            dependency-freeze.txt
            candidate-source.patch
            binary-sha256.txt
            network-sha256.txt
            candidate-bench.txt
            reference-bench.txt
            results/
            results-*.log
