# Rerun marker: pipefail-safe chunk selection
name: Rewrite v4 Lc0 to Stockfish Bridge Smoke

on:
  push:
    branches:
      - leviathan/rewrite-v4-dual-training-data
    paths:
      - '.github/workflows/rewrite-v4-bridge-smoke.yml'

jobs:
  bridge-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit manifests and fetch exact Lc0 shard
        run: |
          python3 rewrite/tools/audit_training_data.py
          python3 rewrite/tools/fetch_training_data.py \
            lc0-small-real-shard-2020-07-13-0822 \
            --output-dir "$RUNNER_TEMP/leviathan-training"
      - name: Extract three real Lc0 chunks
        shell: bash
        run: |
          set -euo pipefail
          tarfile="$RUNNER_TEMP/leviathan-training/lc0-small-real-shard-2020-07-13-0822/training-run3--20200713-0822.tar"
          mkdir -p "$RUNNER_TEMP/lc0-input"
          tar -tf "$tarfile" > "$RUNNER_TEMP/all-entries.txt"
          grep -E '\.gz$' "$RUNNER_TEMP/all-entries.txt" > "$RUNNER_TEMP/gz-entries.txt"
          sed -n '1,3p' "$RUNNER_TEMP/gz-entries.txt" > "$RUNNER_TEMP/chunks.txt"
          test "$(wc -l < "$RUNNER_TEMP/chunks.txt")" -eq 3
          while IFS= read -r f; do tar -xf "$tarfile" -C "$RUNNER_TEMP/lc0-input" "$f"; done < "$RUNNER_TEMP/chunks.txt"
          find "$RUNNER_TEMP/lc0-input" -type f -name '*.gz' -printf '%P %s bytes\n'
      - name: Download minimal 3-piece Syzygy set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syzygy3"
          curl --fail --location --retry 3 \
            'https://syzygy-tables.info/download.txt?source=lichess&max-pieces=3' \
            -o "$RUNNER_TEMP/syzygy3/urls.txt"
          grep -E '^https?://' "$RUNNER_TEMP/syzygy3/urls.txt" > "$RUNNER_TEMP/syzygy3/downloads.txt"
          test -s "$RUNNER_TEMP/syzygy3/downloads.txt"
          count=$(wc -l < "$RUNNER_TEMP/syzygy3/downloads.txt")
          test "$count" -le 32
          total=0
          while IFS= read -r url; do
            name=$(basename "$url")
            curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/syzygy3/$name"
            size=$(stat -c %s "$RUNNER_TEMP/syzygy3/$name")
            total=$((total + size))
            test "$total" -le 104857600
          done < "$RUNNER_TEMP/syzygy3/downloads.txt"
          (cd "$RUNNER_TEMP/syzygy3" && sha256sum *.rtb* | sort) | tee "$RUNNER_TEMP/syzygy3/SHA256SUMS"
          printf 'total_bytes=%s\n' "$total"
      - name: Build pinned official Lc0 rescorer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libprotobuf-dev protobuf-compiler libopenblas-dev zlib1g-dev
          git clone https://github.com/LeelaChessZero/lc0.git "$RUNNER_TEMP/lc0"
          git -C "$RUNNER_TEMP/lc0" checkout d8ce48258c39d331c119f8c8729374ceb3df8409
          git -C "$RUNNER_TEMP/lc0" submodule update --init --recursive
          meson setup "$RUNNER_TEMP/lc0/build" "$RUNNER_TEMP/lc0" \
            --buildtype release -Drescorer=true -Dlc0=false -Dgtest=false -Ddefault_library=static
          meson compile -C "$RUNNER_TEMP/lc0/build"
          find "$RUNNER_TEMP/lc0/build" -type f -executable -name '*rescor*' -print
      - name: Export real Lc0 chunks to Stockfish NNUE plain
        shell: bash
        run: |
          set -euo pipefail
          rescorer=$(find "$RUNNER_TEMP/lc0/build" -type f -executable \( -name 'rescorer' -o -name '*rescore*' \) -print -quit)
          test -n "$rescorer"
          mkdir -p "$RUNNER_TEMP/bridge"
          "$rescorer" rescore \
            --input="$RUNNER_TEMP/lc0-input" \
            --syzygy-paths="$RUNNER_TEMP/syzygy3" \
            --nnue-plain-file="$RUNNER_TEMP/bridge/lc0-stockfish.plain" \
            --nnue-best-score=true \
            --nnue-best-move=true \
            --delete-files=false \
            --threads=1 \
            | tee "$RUNNER_TEMP/bridge/rescorer.log"
          test -s "$RUNNER_TEMP/bridge/lc0-stockfish.plain"
          wc -l "$RUNNER_TEMP/bridge/lc0-stockfish.plain"
          sha256sum "$RUNNER_TEMP/bridge/lc0-stockfish.plain" | tee "$RUNNER_TEMP/bridge/plain.sha256"
      - name: Build pinned Stockfish training-data tools
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/stockfish-tools"
          git -C "$RUNNER_TEMP/stockfish-tools" checkout 9a4c7cf4e311f8d9526b79295b80c4d0464c07cf
          make -C "$RUNNER_TEMP/stockfish-tools/src" -j2 build ARCH=x86-64
          test -x "$RUNNER_TEMP/stockfish-tools/src/stockfish"
      - name: Convert and validate Stockfish binpack
        shell: bash
        run: |
          set -euo pipefail
          sf="$RUNNER_TEMP/stockfish-tools/src/stockfish"
          plain="$RUNNER_TEMP/bridge/lc0-stockfish.plain"
          binpack="$RUNNER_TEMP/bridge/lc0-stockfish.binpack"
          printf 'convert %s %s validate\nquit\n' "$plain" "$binpack" | "$sf" | tee "$RUNNER_TEMP/bridge/stockfish-convert.log"
          test -s "$binpack"
          sha256sum "$binpack" | tee "$RUNNER_TEMP/bridge/binpack.sha256"
          stat -c '%n %s bytes' "$plain" "$binpack"
          cp "$RUNNER_TEMP/chunks.txt" "$RUNNER_TEMP/bridge/source-chunks.txt"
          cp "$RUNNER_TEMP/syzygy3/SHA256SUMS" "$RUNNER_TEMP/bridge/syzygy3.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-v4-lc0-stockfish-bridge-smoke
          path: ${{ runner.temp }}/bridge
          retention-days: 30
