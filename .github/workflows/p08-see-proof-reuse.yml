name: P08 SEE Proof Reuse

on:
  push:
    branches: [agent/p08-see-proof-reuse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless-speed:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact P03 candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: cand
          fetch-depth: 1

      - name: Checkout exact P03 control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: base
          fetch-depth: 1

      - name: Checkout benchmark harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/fundamentals-ultra-lab
          path: harness
          fetch-depth: 1

      - name: Materialize failed-SEE proof reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cand/src/leviathan_fundamentals.h'); s=p.read_text()
          old="inline bool rescue_bad_see(const Position& pos,\n                           Move move,\n                           Square prevSq,\n                           bool capture,\n                           bool givesCheck) {\n    if (!ready() || !state().sacrificeRescue)\n        return false;\n\n    if (move.type_of() == PROMOTION)\n        return true;\n\n    // v2.1: a recapture is not automatically worthy of rescue. Keep only\n    // near-balanced recaptures; obviously losing exchanges should still be\n    // allowed to die in SEE pruning instead of inflating the tree.\n    if (recapture(move, prevSq, capture))\n        return pos.see_ge(move, -300);\n\n    // Checking sacrifices retain the broad rescue path. They are rare and are\n    // exactly where a purely material SEE gate can miss forced tactical ideas.\n    return givesCheck && !pos.see_ge(move, 0);\n}"
          new="inline bool rescue_bad_see(const Position& pos,\n                           Move move,\n                           Square prevSq,\n                           bool capture,\n                           bool givesCheck,\n                           int failedSeeMargin = -1) {\n    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0 || !cfg.sacrificeRescue)\n        return false;\n\n    if (move.type_of() == PROMOTION)\n        return true;\n\n    if (recapture(move, prevSq, capture))\n    {\n        // Caller already proved SEE < -failedSeeMargin. When margin >= 300,\n        // that proof already implies SEE < -300, so the rescue must fail.\n        if (failedSeeMargin >= 300)\n            return false;\n        return pos.see_ge(move, -300);\n    }\n\n    if (!givesCheck)\n        return false;\n\n    // When margin >= 0, failed SEE at threshold -margin already proves SEE < 0.\n    // Preserve the fallback for unusual negative margins.\n    return failedSeeMargin >= 0 || !pos.see_ge(move, 0);\n}"
          if s.count(old)!=1: raise SystemExit('rescue function anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('cand/src/search.cpp'); s=p.read_text()
          old="                    && !Leviathan::Fundamentals::rescue_bad_see(\n                      pos, move, prevSq, capture, givesCheck))"
          new="                    && !Leviathan::Fundamentals::rescue_bad_see(\n                      pos, move, prevSq, capture, givesCheck, margin))"
          if s.count(old)!=1: raise SystemExit('rescue call anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          git -C cand diff --check
          git -C cand diff -- src/search.cpp src/leviathan_fundamentals.h

      - name: Build P03 controls and P08 candidate
        run: |
          make -C base/src net
          make -C base/src clean
          make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C cand/src clean
          make -C cand/src -j2 ARCH=x86-64-avx2 build
          cat > active.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Risk":false,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF

      - name: Exact behavior and calibrated speed screen
        run: |
          python3 harness/tools/lossless_pair_benchmark.py \
            --control-a base/src/control_a \
            --control-b base/src/control_b \
            --candidate cand/src/stockfish \
            --options active.json \
            --rounds 25 \
            --output p08-see-proof.json | tee p08-see-proof.log

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('p08-see-proof.json')); sig=d['signatures']; r=d['results']; exact=True
          for case in ('default','depth11','nodes50k'):
              a=sig['control_a'][case]; c=sig['candidate'][case]
              exact &= a['nodes']==c['nodes'] and a['behavior_sha256']==c['behavior_sha256']
          c=r['candidate']; a=r['control_b']
          out={'exact_behavior':exact,'aa_median':a['median_speedup'],'aa_ci':a['bootstrap_median_95pct_ci'],'candidate_median':c['median_speedup'],'candidate_geo':c['geometric_mean_speedup'],'candidate_ci':c['bootstrap_median_95pct_ci'],'faster_rounds':c['faster_rounds'],'rounds':c['rounds']}
          open('p08-summary.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          if not exact: raise SystemExit('BEHAVIOR_MISMATCH')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-see-proof-${{ github.sha }}
          path: |
            p08-see-proof.json
            p08-see-proof.log
            p08-summary.json
          retention-days: 30
