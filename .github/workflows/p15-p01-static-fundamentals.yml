name: P15 P01 Static Fundamentals
on:
  push:
    branches: [agent/p15-p01-static-fundamentals]
    paths: ['.github/workflows/p15-p01-static-fundamentals.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: agent/p15-p01-static-fundamentals, path: cand, fetch-depth: 5, persist-credentials: true}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 3404fa2ea9b4fe75236e2584be9da3416e646ec2, path: base, fetch-depth: 1}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: leviathan/fundamentals-ultra-lab, path: harness, fetch-depth: 1}
      - name: Materialize static P01 champion Fundamentals
        working-directory: cand
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/leviathan_fundamentals.h')
          s=p.read_text()
          def one(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: count={s.count(old)}')
              s=s.replace(old,new,1)

          one('inline bool ready() { return state().enabled && state().authority > 0; }',
              'inline constexpr bool ready() { return true; }','ready')
          one('''inline bool zugzwang_risk(const Position& pos) {
    if (!ready() || !state().zugzwangGuard)
        return false;

    // Conservative detector: sparse positions with very little non-pawn
    // mobility are where null-move assumptions are structurally least safe.
    return pos.count<ALL_PIECES>() <= 9 && non_pawn_count(pos) <= 2;
}''',
              '''inline bool zugzwang_risk(const Position& pos) {
    return pos.count<ALL_PIECES>() <= 9 && non_pawn_count(pos) <= 2;
}''','zugzwang')
          one('''    if (!ready() || !state().sacrificeRescue)
        return false;

''','', 'rescue-ready')
          one('''    if (!ready())
        return 0;

''','', 'lmr-ready')
          one('delta -= state().forcingBuyback;','delta -= 384;','forcing')
          one('delta -= state().recaptureBuyback;','delta -= 256;','recapture')
          one('delta -= state().passerBuyback;','delta -= 320;','passer')
          one('delta -= state().endgameBuyback;','delta -= 128;','endgame')

          start='    // Authority 2 is the funding mechanism. v2.1 deliberately avoids\n'
          end='        delta += state().quietOverdrive * lateness * depthScale / 48;\n    }\n\n'
          i=s.find(start); j=s.find(end,i)
          if i<0 or j<0:
              raise SystemExit('authority2 block')
          j += len(end)
          s=s[:i] + '    // Champion profile: Authority 1; Authority-2 overdrive compiled out.\n\n' + s[j:]

          one('''inline int quiet_ordering_bonus(const Position& pos, Move move) {
    if (!ready() || !state().rule50Pressure || pos.rule50_count() < 70)
        return 0;

    // Captures are scored in another MovePicker stage. Push pawn moves upward
    // when the fifty-move counter is dangerous because they reset it.
    return pawn_move(pos, move) ? state().rule50PawnBonus : 0;
}''',
              '''inline int quiet_ordering_bonus(const Position& pos, Move move) {
    if (pos.rule50_count() < 70)
        return 0;
    return pawn_move(pos, move) ? 3072 : 0;
}''','rule50-bonus')
          p.write_text(s)

          p=Path('src/movepick.cpp')
          s=p.read_text()
          old='''    const bool leviathanRule50Ready = Type == QUIETS && Leviathan::Fundamentals::ready()
                                      && Leviathan::Fundamentals::state().rule50Pressure
                                      && pos.rule50_count() >= 70;'''
          new='''    const bool leviathanRule50Ready = Type == QUIETS && pos.rule50_count() >= 70;'''
          if s.count(old)!=1:
              raise SystemExit(f'movepick-rule50: count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Build
        run: |
          make -C base/src net && make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a; cp base/src/stockfish base/src/control_b
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
          echo '{"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Risk":false,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}' > active.json
      - name: Benchmark
        run: python3 harness/tools/lossless_pair_benchmark.py --control-a base/src/control_a --control-b base/src/control_b --candidate cand/src/stockfish --options active.json --rounds 31 --output p15.json | tee p15.log
      - name: Gate
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('p15.json'));s=d['signatures'];r=d['results'];exact=True
          for c in ('default','depth11','nodes50k'):
              exact &= s['control_a'][c]['nodes']==s['candidate'][c]['nodes'] and s['control_a'][c]['behavior_sha256']==s['candidate'][c]['behavior_sha256']
          x=r['candidate'];a=r['control_b']
          o={'exact':exact,'aa_median':a['median_speedup'],'aa_ci':a['bootstrap_median_95pct_ci'],'median':x['median_speedup'],'geo':x['geometric_mean_speedup'],'ci':x['bootstrap_median_95pct_ci'],'faster':x['faster_rounds'],'rounds':x['rounds']}
          open('p15-summary.json','w').write(json.dumps(o,indent=2));print(json.dumps(o,indent=2))
          if not exact or x['bootstrap_median_95pct_ci'][0] <= 1.0:
              raise SystemExit('P15_GATE_FAIL')
          PY
      - name: Materialize source
        working-directory: cand
        run: |
          git config user.name 'Leviathan Research Bot'; git config user.email '154391238+mrman123312@users.noreply.github.com'
          git add src/leviathan_fundamentals.h src/movepick.cpp
          git commit -m 'P15: materialize static champion Fundamentals [skip ci]'
          git push origin HEAD:agent/p15-p01-static-fundamentals
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p15-${{ github.sha }}', path: 'p15*', retention-days: 30}
