name: Fundamentals Ultra Active Fast Path

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-fundamentals-fastpath.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: cand}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: base}

      - name: Cache active Fundamentals classifications without changing semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cand/src/leviathan_fundamentals.h')
          s=p.read_text()
          start=s.index('inline int lmr_adjustment(')
          end=s.index('\ninline int quiet_ordering_bonus', start)
          f=s[start:end]
          f=f.replace('    if (!ready())\n        return 0;','    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0)\n        return 0;',1)
          f=f.replace('state().forcingBuyback','cfg.forcingBuyback')
          f=f.replace('if (recapture(move, prevSq, capture))','if (isRecapture)',1)
          f=f.replace('state().recaptureBuyback','cfg.recaptureBuyback')
          f=f.replace('if (move.type_of() == PROMOTION || advanced_pawn_move(pos, move))','if (isPromotion || isAdvancedPawn)',1)
          f=f.replace('state().passerBuyback','cfg.passerBuyback')
          f=f.replace('if (low_material(pos) &&','if (isLowMaterial &&',1)
          f=f.replace('state().endgameBuyback','cfg.endgameBuyback')
          f=f.replace('state().authority >= 2','cfg.authority >= 2')
          f=f.replace('move.type_of() != PROMOTION && !advanced_pawn_move(pos, move)','!isPromotion && !isAdvancedPawn',1)
          f=f.replace('!low_material(pos)','!isLowMaterial',1)
          f=f.replace('state().quietOverdrive','cfg.quietOverdrive')
          f=f.replace('    int delta = 0;','    const bool isRecapture = recapture(move, prevSq, capture);\n    const bool isPromotion = move.type_of() == PROMOTION;\n    const bool isAdvancedPawn = advanced_pawn_move(pos, move);\n    const bool isLowMaterial = low_material(pos);\n\n    int delta = 0;',1)
          if 'const bool isRecapture = isRecapture' in f or 'const bool isLowMaterial = isLowMaterial' in f:
              raise SystemExit('self-reference introduced')
          s=s[:start]+f+s[end:]
          s=s.replace('inline bool ready() { return state().enabled && state().authority > 0; }','inline bool ready() {\n    const State& cfg = state();\n    return cfg.enabled && cfg.authority > 0;\n}',1)
          old='inline bool zugzwang_risk(const Position& pos) {\n    if (!ready() || !state().zugzwangGuard)\n        return false;'
          new='inline bool zugzwang_risk(const Position& pos) {\n    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0 || !cfg.zugzwangGuard)\n        return false;'
          if s.count(old)!=1: raise SystemExit('zugzwang anchor')
          s=s.replace(old,new,1)
          start=s.index('inline int quiet_ordering_bonus(')
          end=s.index('\ninline bool allow_null_move', start)
          q=s[start:end]
          q=q.replace('    if (!ready() || !state().rule50Pressure || pos.rule50_count() < 70)','    const State& cfg = state();\n    if (!cfg.enabled || cfg.authority <= 0 || !cfg.rule50Pressure || pos.rule50_count() < 70)',1)
          q=q.replace('state().rule50PawnBonus','cfg.rule50PawnBonus')
          s=s[:start]+q+s[end:]
          p.write_text(s)
          PY
          git -C cand diff --check
          git -C cand diff -- src/leviathan_fundamentals.h | tee candidate.patch

      - name: Build A/A controls and candidate
        run: |
          make -C base/src net && make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
          cat > active.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Risk":false,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF

      - name: Strict transcript-equivalent 31-round speed replication
        run: |
          python3 lab/tools/lossless_pair_benchmark.py --control-a base/src/control_a --control-b base/src/control_b --candidate cand/src/stockfish --options active.json --rounds 31 --output active-fastpath.json | tee active-fastpath.log

      - uses: actions/upload-artifact@v4
        with:
          name: ultra-active-fastpath
          path: |
            active-fastpath.json
            active-fastpath.log
            candidate.patch
          retention-days: 30
