name: Apply strength v5 margin skeptic

on:
  push:
    branches:
      - leviathan/strength-v5-margin-skeptic
    paths:
      - '.github/workflows/apply-strength-v5-margin-skeptic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v5-margin-skeptic

      - name: Add near-alpha fail-low skeptic re-search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search.cpp')
          s = p.read_text()
          anchor = "                // Post LMR continuation history updates\n                update_continuation_histories(ss, movedPiece, move.to_sq(), 1334);\n            }\n        }\n\n        // Step 18. Full-depth search when LMR is skipped\n"
          replacement = (
              "                // Post LMR continuation history updates\n"
              "                update_continuation_histories(ss, movedPiece, move.to_sq(), 1334);\n"
              "            }\n"
              "            // Leviathan strength v5 - Margin Skeptic Search.\n"
              "            // A reduced quiet move that misses alpha by only a small margin may\n"
              "            // have missed because of the reduction itself. Re-open only near-\n"
              "            // boundary, genuinely reduced branches instead of globally inflating depth.\n"
              "            else if (d < newDepth && depth >= 6 && moveCount <= 10 && !capture && !givesCheck\n"
              "                     && value >= alpha - (18 + 3 * std::min(int(depth), 12))\n"
              "                     && (PvNode || ss->ttPv\n"
              "                         || Leviathan::Fundamentals::quiet_tactical_tension(\n"
              "                           pos, move, capture, givesCheck)))\n"
              "            {\n"
              "                leviathanResearched = true;\n"
              "                value = -search<NonPV>(pos, ss + 1, -(alpha + 1), -alpha, newDepth, !cutNode);\n"
              "\n"
              "                if (value > alpha)\n"
              "                    update_continuation_histories(ss, movedPiece, move.to_sq(), 1334);\n"
              "            }\n"
              "        }\n"
              "\n"
              "        // Step 18. Full-depth search when LMR is skipped\n"
          )
          if s.count(anchor) != 1:
              raise SystemExit(f'anchor count {s.count(anchor)}')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          git diff --check
          git diff -- src/search.cpp

      - name: Commit strength search change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.cpp
          git commit -m 'Strength v5: verify near-alpha LMR fail-lows'
          git push origin HEAD:leviathan/strength-v5-margin-skeptic
