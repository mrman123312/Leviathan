name: bedrock-frozen
on:
  push:
    branches: [bedrock-frozen-expressive]
  pull_request:
    paths: ['src/leviathan/bedrock/**', 'tests/test_bedrock*', 'scripts/check_bedrock_hf.py', '.github/workflows/bedrock-frozen.yml']
permissions:
  contents: read
concurrency:
  group: bedrock-frozen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU correctness dependencies only
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install -e . 'transformers==5.8.1' safetensors
      - name: Run existing and new tests (no training or pretrained download)
        run: |
          set -o pipefail
          mkdir -p evidence/bedrock
          python scripts/validate_model_registry.py
          python scripts/verify_bedrock_capsule.py
          python -m unittest discover -s tests -v 2>&1 | tee evidence/bedrock/ci-tests.txt
          python scripts/check_bedrock_hf.py
          python scripts/benchmark_bedrock_mechanisms.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bedrock-frozen-evidence-${{ github.sha }}
          path: evidence/bedrock/
          retention-days: 14
