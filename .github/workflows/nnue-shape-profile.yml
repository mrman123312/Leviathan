name: Leviathan NNUE update-shape profile

on:
  push:
    branches: [leviathan/speed-v3-profile]
    paths: ['.github/workflows/nnue-shape-profile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shapes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d
      - name: Instrument apply_combined cardinalities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nnue/nnue_accumulator.cpp');s=p.read_text()
          s=s.replace('#include <new>','#include <new>\n#include <cstdio>\n#include <cstdlib>\n#include <cstdint>')
          anchor='''void apply_combined(Color                              perspective,'''
          instrument=r'''
struct LeviathanShapeStats {
    std::uint64_t counts[8][8][8][8]{};
    std::uint64_t total = 0;
    ~LeviathanShapeStats() {
        if (!std::getenv("LEVIATHAN_NNUE_SHAPES")) return;
        std::fprintf(stderr, "LVSHAPE_TOTAL %llu\n", (unsigned long long) total);
        for (int a=0;a<8;++a) for (int r=0;r<8;++r)
          for (int ta=0;ta<8;++ta) for (int tr=0;tr<8;++tr)
            if (counts[a][r][ta][tr])
              std::fprintf(stderr,"LVSHAPE %d %d %d %d %llu\n",a,r,ta,tr,
                           (unsigned long long)counts[a][r][ta][tr]);
    }
};
LeviathanShapeStats leviathanShapeStats;

'''
          if anchor not in s: raise SystemExit('anchor missing')
          s=s.replace(anchor,instrument+anchor,1)
          body='''    const auto& fromAcc = from.accumulation[perspective];'''
          repl='''    if (std::getenv("LEVIATHAN_NNUE_SHAPES")) {
        const int a=std::min(7,psqAdded.ssize()), r=std::min(7,psqRemoved.ssize());
        const int ta=std::min(7,thrAdded.ssize()), tr=std::min(7,thrRemoved.ssize());
        ++leviathanShapeStats.counts[a][r][ta][tr]; ++leviathanShapeStats.total;
    }

    const auto& fromAcc = from.accumulation[perspective];'''
          if body not in s: raise SystemExit('body anchor missing')
          s=s.replace(body,repl,1);p.write_text(s)
          PY
      - name: Build and profile
        working-directory: src
        run: |
          make net && make -j2 ARCH=x86-64-avx2 build
          LEVIATHAN_NNUE_SHAPES=1 ./stockfish bench 2>&1 | tee ../shapes.log
      - name: Rank shapes
        run: |
          python3 - <<'PY' | tee shapes-summary.txt
          import re,json
          rows=[];total=0
          for line in open('shapes.log',errors='ignore'):
            if line.startswith('LVSHAPE_TOTAL '): total=int(line.split()[1])
            elif line.startswith('LVSHAPE '):
              p=line.split();rows.append({'psq_add':int(p[1]),'psq_remove':int(p[2]),'threat_add':int(p[3]),'threat_remove':int(p[4]),'count':int(p[5])})
          rows.sort(key=lambda x:x['count'],reverse=True)
          cum=0
          for i,x in enumerate(rows[:30],1):
            cum+=x['count'];x['fraction']=x['count']/total if total else 0;x['top_cumulative']=cum/total if total else 0
            print(i,x)
          out={'total':total,'unique_shapes':len(rows),'top':rows[:30]}
          open('shapes.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nnue-shape-profile
          path: |
            shapes.log
            shapes-summary.txt
            shapes.json
