name: Apply strength v5 TT provenance

on:
  push:
    branches:
      - leviathan/strength-v5-margin-skeptic
    paths:
      - '.github/workflows/apply-strength-v5-tt-provenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v5-margin-skeptic

      - name: Downgrade TT authority on repeated trajectories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search.cpp')
          s = p.read_text()

          old_eval = "        if (is_valid(ttData.value)\n            && (ttData.bound & (ttData.value > eval ? BOUND_LOWER : BOUND_UPPER)))\n            eval = ttData.value;"
          new_eval = "        // Leviathan strength v5: a TT bound is board-key evidence, not full\n        // trajectory proof. After repetition has entered the current history,\n        // keep TT move/static-eval reuse but do not let an old bound replace the\n        // current static evaluation used by pruning decisions.\n        if (!pos.has_repeated() && is_valid(ttData.value)\n            && (ttData.bound & (ttData.value > eval ? BOUND_LOWER : BOUND_UPPER)))\n            eval = ttData.value;"

          old_cutoff = "        if (pos.rule50_count() < 96)\n        {"
          new_cutoff = "        if (pos.rule50_count() < 96 && !pos.has_repeated())\n        {"

          if s.count(old_eval) != 1:
              raise SystemExit(f'eval anchor count {s.count(old_eval)}')
          if s.count(old_cutoff) != 1:
              raise SystemExit(f'cutoff anchor count {s.count(old_cutoff)}')

          s = s.replace(old_eval, new_eval, 1)
          s = s.replace(old_cutoff, new_cutoff, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/search.cpp

      - name: Commit TT provenance change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.cpp
          git commit -m 'Strength v5: make TT authority history-aware'
          git push origin HEAD:leviathan/strength-v5-margin-skeptic
