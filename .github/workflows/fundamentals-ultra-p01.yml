name: Fundamentals Ultra P0+P1 Lossless Speed

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-p01.yml']

permissions:
  contents: write

jobs:
  p01:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-v2.1, path: base, fetch-depth: 0}
      - name: Clone candidate tree
        run: cp -a base cand
      - name: Apply P0+P1 dead-organ fast paths only
        run: |
          python3 - <<'PY'
