      - name: Build identical AVX2 binaries
        run: |
          make -C base/src net
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
      - name: Strict exact-behavior 31-round A/A/B speed test
        run: |
          python3 - <<'PY' | tee speed.json
          import subprocess,re,hashlib,json,statistics,random
          A='base/src/control_a'; B='base/src/control_b'; C='cand/src/stockfish'
          opts='setoption name Threads value 1\nsetoption name Hash value 64\nsetoption name Leviathan Fundamentals value true\nsetoption name Leviathan Fundamentals Authority value 1\nsetoption name Leviathan Quiet Overdrive value 0\n'
          cmds={'default':'bench','depth11':'bench 16 1 11 default depth','nodes50k':'bench 16 1 50000 default nodes'}
          def run(path,cmd):
            p=subprocess.run([path],input=opts+cmd+'\nquit\n',text=True,capture_output=True,check=True);o=p.stdout+p.stderr
            norm=[]
            for raw in o.splitlines():
              line=raw.strip()
              if line.startswith('Position:') or line.startswith('bestmove '):norm.append(line)
              elif line.startswith('info ') and not line.startswith('info string '):
                line=re.sub(r'\s+nps\s+\d+','',line);line=re.sub(r'\s+time\s+\d+','',line);norm.append(line)
            return {'ms':int(re.findall(r'Total time \(ms\)\s*:\s*(\d+)',o)[-1]),'nodes':int(re.findall(r'Nodes searched\s*:\s*(\d+)',o)[-1]),'sig':hashlib.sha256('\n'.join(norm).encode()).hexdigest()}
          sig={}
          for name,cmd in cmds.items():
            sig[name]={x:run(p,cmd) for x,p in [('A',A),('B',B),('C',C)]}
            if len({(v['nodes'],v['sig']) for v in sig[name].values()})!=1:raise SystemExit(f'LOSSLESS GATE FAILED {name}: {sig[name]}')
          # Warm-up then alternating sandwich A/C/B, B/C/A; A/A calibrates in same rounds.
          run(A,'bench');run(B,'bench');run(C,'bench'); ca=[];cc=[]
          for i in range(31):
            if i&1:
              first=run(B,'bench')['ms']; cm=run(C,'bench')['ms']; second=run(A,'bench')['ms']; bm=run(B,'bench')['ms']
            else:
              first=run(A,'bench')['ms']; cm=run(C,'bench')['ms']; second=run(B,'bench')['ms']; bm=run(B,'bench')['ms']
            ref=(first*second)**0.5;cc.append(ref/cm);ca.append(ref/bm)
          out={'signatures':sig,'aa_median':statistics.median(ca),'candidate_median_speedup':statistics.median(cc),'candidate_mean_speedup':statistics.fmean(cc),'candidate_faster_rounds':sum(x>1 for x in cc),'rounds':31}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Publish materialized candidate
        working-directory: cand
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B leviathan/fundamentals-ultra-p01
          git add src/leviathan_dsl.h src/leviathan_trace.h src/movepick.cpp src/search.cpp
          git commit -m 'Ultra: lossless P0+P1 dead-organ fast paths'
          git push --force origin HEAD:leviathan/fundamentals-ultra-p01
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals-ultra-p01
          path: speed.json
          retention-days: 30
