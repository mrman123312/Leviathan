name: Fundamentals Ultra P01 Lossless Speed

on:
  push:
    branches:
      - leviathan/fundamentals-ultra-lab
    paths:
      - .github/workflows/fundamentals-ultra-p01.yml
      - tools/apply_p01.py
      - tools/lossless_pair_benchmark.py

permissions:
  contents: write

jobs:
  p01:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leviathan/fundamentals-ultra-lab
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: leviathan/fundamentals-v2.1
          path: base
          fetch-depth: 0
      - name: Materialize P01 candidate
        run: |
          cp -a base cand
          cp lab/tools/apply_p01.py cand/tools/apply_p01.py
          cd cand
          python3 tools/apply_p01.py
          git diff --check
      - name: Build identical AVX2 binaries
        run: |
          make -C base/src net
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C base/src clean
          make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          make -C cand/src clean
          make -C cand/src -j2 ARCH=x86-64-avx2 build
      - name: Write frozen options
        run: |
          cat > options.json <<'EOF'
          {
            "Threads": 1,
            "Hash": 64,
            "Leviathan Fundamentals": true,
            "Leviathan Fundamentals Authority": 1,
            "Leviathan Quiet Overdrive": 0,
            "Leviathan Search DSL": false,
            "Leviathan Risk": false,
            "Leviathan Atlas": false,
            "Leviathan Policy": false
          }
          EOF
      - name: Strict exact-behavior A/A/B speed test
        run: |
          python3 lab/tools/lossless_pair_benchmark.py \
            --control-a base/src/control_a \
            --control-b base/src/control_b \
            --candidate cand/src/stockfish \
            --options options.json --rounds 31 --output speed.json \
            | tee speed.log
      - name: Publish candidate branch
        working-directory: cand
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B leviathan/fundamentals-ultra-p01
          git add src/leviathan_dsl.h src/leviathan_trace.h src/movepick.cpp src/search.cpp
          git commit -m 'Ultra: lossless P0+P1 dead-organ fast paths'
          git push --force origin HEAD:leviathan/fundamentals-ultra-p01
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals-ultra-p01
          path: |
            speed.json
            speed.log
            options.json
          retention-days: 30
