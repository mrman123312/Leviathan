name: Leviathan V8.4 vs V7.4 strength gate

on:
  push:
    branches:
      - leviathan/strength-v8-4-causal-minimal
    paths:
      - '.github/workflows/strength-v8-4-vs-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strength-gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact V8.4 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: da187d4d4ddd981a9c27ca4110a7767e6851a326
          path: v8

      - name: Checkout exact V7.4 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9ffe3f2c43972fc55163300449e97a981a01e358
          path: v7

      - name: Install deterministic match dependency
        run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'

      - name: Source and causal-authority invariants
        run: |
          set -euo pipefail
          test "$(git -C v8 rev-parse HEAD)" = 'da187d4d4ddd981a9c27ca4110a7767e6851a326'
          test "$(git -C v7 rev-parse HEAD)" = '9ffe3f2c43972fc55163300449e97a981a01e358'
          grep -q 'leviathanLmrWitness' v8/src/search.cpp
          grep -q 'leviathanEntryDepth >= leviathanWitnessCertifiedDepth + 2' v8/src/search.cpp
          grep -q 'move == persistentWitness && leviathanLmrWitness && (PvNode || ss->ttPv)' v8/src/search.cpp
          ! grep -q '!Leviathan::Evidence::tt_sensitive(leviathanEvidence)' v8/src/search.cpp
          ! grep -q 'Leviathan::Evidence::pruning_sensitive(leviathanEvidence) && moveCount <= 4' v8/src/search.cpp
          ! grep -q 'Leviathan::Evidence::rival_sensitive(leviathanEvidence) && moveCount <= 4' v8/src/search.cpp
          ! grep -q 'leviathanEvidence.severe() && moveCount <= 3' v8/src/search.cpp
          grep -q 'Leviathan::Evidence::Mask(' v8/src/search.h

      - name: Build both engines identically and reject new V8 warnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/v8/src"
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build 2>&1 | tee "$GITHUB_WORKSPACE/v8-build.log"
          mv stockfish stockfish-v8
          if grep -E 'search\.h:.*warning: narrowing conversion|search\.cpp:.*warning:.*leviathan' "$GITHUB_WORKSPACE/v8-build.log"; then
            echo 'V8.4 introduced a Leviathan warning' >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/v7/src"
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build 2>&1 | tee "$GITHUB_WORKSPACE/v7-build.log"
          mv stockfish stockfish-v7

      - name: Verify UCI parity
        run: |
          set -euo pipefail
          printf 'uci\nquit\n' | ./v8/src/stockfish-v8 > v8-uci.txt
          printf 'uci\nquit\n' | ./v7/src/stockfish-v7 > v7-uci.txt
          for F in v8-uci.txt v7-uci.txt; do
            grep -q 'option name Leviathan Fundamentals ' "$F"
            grep -q 'option name Leviathan Fundamentals Authority ' "$F"
            grep -q 'option name Leviathan Quiet Overdrive ' "$F"
          done

      - name: Create identical options and exact opening bank
        run: |
          set -euo pipefail
          mkdir -p match
          cat > match/options.json <<'EOF'
          {
            "Threads": 1,
            "Hash": 64,
            "Leviathan Fundamentals": true,
            "Leviathan Fundamentals Authority": 1,
            "Leviathan Quiet Overdrive": 0,
            "Leviathan Policy": false,
            "Leviathan MetaSearch": false,
            "Leviathan Risk": false,
            "Leviathan Specialist": false,
            "Leviathan Atlas": false,
            "Leviathan Search DSL": false
          }
          EOF
          python3 - <<'PY'
          import chess, random, hashlib
          from pathlib import Path
          seeds=[
            ['e2e4','e7e5','g1f3','b8c6'],['e2e4','c7c5','g1f3','d7d6'],
            ['e2e4','e7e6','d2d4','d7d5'],['e2e4','c7c6','d2d4','d7d5'],
            ['d2d4','d7d5','c2c4','e7e6'],['d2d4','g8f6','c2c4','g7g6'],
            ['d2d4','g8f6','c2c4','e7e6'],['c2c4','e7e5','b1c3','g8f6'],
            ['g1f3','d7d5','g2g3','g8f6'],['e2e4','g8f6','e4e5','f6d5'],
            ['c2c4','c7c5','g1f3','g8f6'],['d2d4','f7f5','g2g3','g8f6']]
          rng=random.Random(89108083); out=[]
          for i in range(20):
            b=chess.Board()
            for u in seeds[i%len(seeds)]:
              m=chess.Move.from_uci(u)
              if m in b.legal_moves: b.push(m)
            for _ in range(4+(i%7)):
              moves=sorted(b.legal_moves,key=lambda m:m.uci())
              if not moves or b.is_game_over(): break
              b.push(moves[rng.randrange(len(moves))])
            if b.is_game_over(): raise SystemExit(f'terminal opening {i}')
            out.append(b.fen())
          text='\n'.join(out)+'\n'; digest=hashlib.sha256(text.encode()).hexdigest()
          Path('match/openings.fen').write_text(text)
          Path('match/openings.sha256').write_text(digest+'\n')
          assert digest == '87f3e3780aac2deba3730528fb35032228982e6b5268798c5d72144363aaeb2a'
          print('opening_sha256',digest)
          PY

      - name: Equal-node gate - 40 paired games
        id: equalnode
        run: |
          set -euo pipefail
          python3 v8/tools/run_match.py \
            --engine-a "$GITHUB_WORKSPACE/v8/src/stockfish-v8" \
            --engine-b "$GITHUB_WORKSPACE/v7/src/stockfish-v7" \
            --options-a match/options.json --options-b match/options.json \
            --openings match/openings.fen --games 40 --nodes-per-move 20000 \
            --max-plies 220 --out match/equal-node.json | tee match/equal-node.log
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('match/equal-node.json'))['summary']
          print('score='+str(s['score_a']))
          print('survives='+('true' if s['score_a'] >= 0.5 else 'false'))
          PY

      - name: Fixed-time economics - 40 paired games
        if: steps.equalnode.outputs.survives == 'true'
        run: |
          set -euo pipefail
          python3 v8/tools/run_match.py \
            --engine-a "$GITHUB_WORKSPACE/v8/src/stockfish-v8" \
            --engine-b "$GITHUB_WORKSPACE/v7/src/stockfish-v7" \
            --options-a match/options.json --options-b match/options.json \
            --openings match/openings.fen --games 40 --movetime-ms 50 \
            --max-plies 220 --out match/fixed-time.json | tee match/fixed-time.log

      - name: Produce decision report
        if: always() && steps.equalnode.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          def summary(path):
            d=json.loads(Path(path).read_text()); s=d['summary']; vals=[g['score_a'] for g in d['games']]
            n=len(vals); mean=sum(vals)/n; var=sum((x-mean)**2 for x in vals)/(n-1) if n>1 else 0
            se=(var/n)**0.5; p=s['score_a']
            return {'games':n,'wins':s['wins_a'],'draws':s['draws'],'losses':s['losses_a'],
                    'score':p,'naive_elo':400*math.log10(p/(1-p)) if 0<p<1 else None,
                    'normal_95_score_ci':[max(0,mean-1.96*se),min(1,mean+1.96*se)],'resource':s['resource']}
          en=summary('match/equal-node.json')
          ft=summary('match/fixed-time.json') if Path('match/fixed-time.json').exists() else None
          if en['score'] < .5: decision='KILL_OR_REDESIGN'
          elif ft is None: decision='RETEST'
          elif ft['score'] < .5: decision='REDESIGN_FOR_ECONOMICS'
          else: decision='KEEP_AND_SCALE_TEST'
          r={'candidate':'V8.4 causal-minimal LMR certificate','candidate_source':'da187d4d4ddd981a9c27ca4110a7767e6851a326',
             'reference':'V7.4','reference_source':'9ffe3f2c43972fc55163300449e97a981a01e358',
             'opening_sha256':Path('match/openings.sha256').read_text().strip(),'equal_node':en,'fixed_time':ft,
             'decision':decision,'statistical_status':'first-pass screen only; not statistically established'}
          Path('match/report.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          PY

      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-4-vs-v7-4-strength-gate
          path: |
            match/
            v8-build.log
            v7-build.log
            v8-uci.txt
            v7-uci.txt
          if-no-files-found: error
