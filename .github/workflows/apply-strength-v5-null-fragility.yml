name: Apply strength v5 null fragility

on:
  push:
    branches:
      - leviathan/strength-v5-margin-skeptic
    paths:
      - '.github/workflows/apply-strength-v5-null-fragility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v5-margin-skeptic

      - name: Turn failed null move into a node-level fragility signal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search.cpp')
          s = p.read_text()

          old_bool = "    bool  givesCheck, improving, priorCapture, opponentWorsening;\n    bool  capture, ttCapture;"
          new_bool = "    bool  givesCheck, improving, priorCapture, opponentWorsening;\n    bool  capture, ttCapture, leviathanNullFragile;"

          old_init = "    probCutNearValue = -VALUE_INFINITE;\n    priorReduction   = (ss - 1)->reduction;"
          new_init = "    probCutNearValue      = -VALUE_INFINITE;\n    leviathanNullFragile = false;\n    priorReduction        = (ss - 1)->reduction;"

          old_null = "        undo_null_move(pos);\n\n        // Do not return unproven mate or TB scores"
          new_null = "        undo_null_move(pos);\n\n        // Leviathan strength v5 - Null Fragility Memory. If static evaluation\n        // expected a cutoff but losing one tempo collapses the reduced search,\n        // the node is unusually tempo-dependent. Preserve that paid-for warning\n        // and become less willing to discard quiet alternatives below.\n        if (depth >= 6 && nullValue < beta\n            && ss->staticEval - nullValue >= 192 && !is_decisive(nullValue))\n            leviathanNullFragile = true;\n\n        // Do not return unproven mate or TB scores"

          old_skip = "            if (moveCount >= (3 + depth * depth) / (2 - improving))\n                mp.skip_quiet_moves();"
          new_skip = "            if (!leviathanNullFragile\n                && moveCount >= (3 + depth * depth) / (2 - improving))\n                mp.skip_quiet_moves();"

          old_scope = "                const bool leviathanScopeProtected =\n                  Leviathan::Fundamentals::protected_scope_move(\n                    pos, move, prevSq, capture, givesCheck);"
          new_scope = "                const bool leviathanScopeProtected =\n                  Leviathan::Fundamentals::protected_scope_move(\n                    pos, move, prevSq, capture, givesCheck)\n                  || (leviathanNullFragile && moveCount <= 10);"

          old_r = "        // ProbCut near-miss evidence means this move already survived a reduced\n        // tactical proof attempt above beta. Give that paid-for evidence a bounded\n        // depth buyback when the normal search reaches the same move.\n        if (move == probCutNearMiss)\n            r -= 768;\n\n        r -= moveCount * 65;"
          new_r = "        // ProbCut near-miss evidence means this move already survived a reduced\n        // tactical proof attempt above beta. Give that paid-for evidence a bounded\n        // depth buyback when the normal search reaches the same move.\n        if (move == probCutNearMiss)\n            r -= 768;\n\n        // A failed null-move shortcut says the position depends heavily on making\n        // a real move now. Buy back a small amount of depth on quiet candidates.\n        if (leviathanNullFragile && !capture && !givesCheck && moveCount <= 10)\n            r -= 256;\n\n        r -= moveCount * 65;"

          for label, old, new in [
              ('bool', old_bool, new_bool),
              ('init', old_init, new_init),
              ('null', old_null, new_null),
              ('skip', old_skip, new_skip),
              ('scope', old_scope, new_scope),
              ('reduction', old_r, new_r),
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f'{label} anchor count {s.count(old)}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/search.cpp

      - name: Commit null-fragility memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.cpp
          git commit -m 'Strength v5: reuse failed-null fragility evidence'
          git push origin HEAD:leviathan/strength-v5-margin-skeptic
