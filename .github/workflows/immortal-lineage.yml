name: Leviathan Immortal Lineage

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Search Foundry candidate seed
        required: true
        default: '8910'
      games:
        description: Paired screening games
        required: true
        default: '20'
      movetime_ms:
        description: Wall-clock milliseconds per move per engine
        required: true
        default: '50'
      openings_path:
        description: Optional repository path containing one FEN per line
        required: false
        default: ''

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure integrated hooks
        run: python3 tools/bootstrap_immortal.py

      - name: Lightweight match dependency
        run: python3 -m pip install --disable-pip-version-check 'python-chess>=1.999,<2'

      - name: Initialize lineage and generate independent Search-DSL candidate
        run: |
          mkdir -p artifacts
          printf 'parent_commit=5062aee519a1ba262d472d8ab139851ced56573e\nbench=2884956\n' > artifacts/baseline.identity
          python3 foundry/lineage.py init \
            --state artifacts/lineage.json \
            --artifact artifacts/baseline.identity \
            --id P000
          python3 foundry/foundry.py new \
            --out artifacts/candidate.lvsd \
            --seed '${{ inputs.seed }}'
          python3 foundry/foundry.py validate artifacts/candidate.lvsd
          python3 foundry/lineage.py register \
            --state artifacts/lineage.json \
            --artifact artifacts/candidate.lvsd \
            --id 'dsl-${{ inputs.seed }}' \
            --parent ACTIVE

      - name: Build AVX2
        working-directory: src
        run: |
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build

      - name: Parent signature
        working-directory: src
        run: |
          ./stockfish bench 2>&1 | tee ../artifacts/parent-bench.txt
          grep -q '2884956' ../artifacts/parent-bench.txt

      - name: Write A/B option files
        run: |
          cat > artifacts/parent.json <<'EOF'
          {
            "Threads": 1,
            "Hash": 64
          }
          EOF
          cat > artifacts/candidate.json <<EOF
          {
            "Threads": 1,
            "Hash": 64,
            "Leviathan Search DSL File": "${GITHUB_WORKSPACE}/artifacts/candidate.lvsd",
            "Leviathan Search DSL Authority": 1,
            "Leviathan Search DSL": true
          }
          EOF

      - name: Paired same-binary screening match
        run: |
          OPENING_ARG=''
          if [ -n '${{ inputs.openings_path }}' ]; then
            OPENING_ARG="--openings ${{ inputs.openings_path }}"
          fi
          python3 tools/run_match.py \
            --engine-a "${GITHUB_WORKSPACE}/src/stockfish" \
            --engine-b "${GITHUB_WORKSPACE}/src/stockfish" \
            --options-a artifacts/candidate.json \
            --options-b artifacts/parent.json \
            --games '${{ inputs.games }}' \
            --movetime-ms '${{ inputs.movetime_ms }}' \
            $OPENING_ARG \
            --out artifacts/match.json

      - name: Screening SPRT and lineage evidence
        run: |
          python3 tools/sprt.py --match artifacts/match.json --elo0 0 --elo1 2 \
            | tee artifacts/sprt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          sprt = json.loads(Path('artifacts/sprt.json').read_text())
          evidence = {
              'compile_ok': True,
              'parent_signature_ok': True,
              'nps_delta_pct': 0.0,
              'screening_verdict': sprt['verdict'],
              'screening_games': sprt['games'],
              'screening_score': sprt['score'],
              # Screening cannot satisfy final promotion gates.
              'elo': 0.0,
              'stc_pass': False,
              'ltc_pass': False,
              'multi_hardware_pass': False,
          }
          Path('artifacts/evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          python3 foundry/lineage.py evidence \
            --state artifacts/lineage.json \
            --id 'dsl-${{ inputs.seed }}' \
            --evidence artifacts/evidence.json \
            | tee artifacts/lineage-decision.json
          python3 foundry/lineage.py status --state artifacts/lineage.json \
            | tee artifacts/lineage-status.json

      - name: Archive lineage evidence
        uses: actions/upload-artifact@v4
        with:
          name: immortal-lineage-seed-${{ inputs.seed }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
