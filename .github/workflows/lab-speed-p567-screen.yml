name: Leviathan P5 P6 P7 strict lossless screens

on:
  push:
    branches: [leviathan/lab-v4-speed-p567]
    paths:
      - '.github/workflows/lab-speed-p567-screen.yml'
      - 'tools/lossless_pair_benchmark.py'
      - 'experiments/options/active_fundamentals.json'
      - 'experiments/manifests/speed_p567_screen.json'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: lab-speed-p567-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  strict-screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: p5-fact-reuse
            candidate_sha: 8af1e6f515eacaae8196f8f75a06d62a302dbf37
          - candidate: p6-global-state
            candidate_sha: 8f28d37481243114b6789f584f853859b5f4713d
          - candidate: p7-cold-outline
            candidate_sha: e373f88f31b815f5c25b8ff3922f63b47a807ef9
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: lab
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: a38620d49cd28d0f1bddd776658dda4b47dd4c96
          path: reference
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.candidate_sha }}
          path: candidate
      - name: Record immutable provenance and source delta
        run: |
          set -euo pipefail
          {
            echo "candidate=${{ matrix.candidate }}"
            echo "candidate_declared_sha=${{ matrix.candidate_sha }}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            uname -a
            lscpu
            g++ --version
            git -C lab rev-parse HEAD
            git -C lab rev-parse 'HEAD^{tree}'
            git -C reference rev-parse HEAD
            git -C reference rev-parse 'HEAD^{tree}'
            git -C candidate rev-parse HEAD
            git -C candidate rev-parse 'HEAD^{tree}'
            test "$(git -C candidate rev-parse HEAD)" = "${{ matrix.candidate_sha }}"
            sha256sum lab/tools/lossless_pair_benchmark.py
            sha256sum lab/experiments/options/active_fundamentals.json
            sha256sum lab/experiments/manifests/speed_p567_screen.json
          } | tee provenance.txt
          set +e
          diff -ru --exclude='*.nnue' reference/src candidate/src > candidate-source.patch
          diff_status=$?
          set -e
          if (( diff_status > 1 )); then exit "$diff_status"; fi
          test -s candidate-source.patch
      - name: Build frozen P01 control and frozen candidate
        run: |
          set -euo pipefail
          make -C reference/src net
          cp reference/src/nn-ab28990d4ea3.nnue candidate/src/
          make -C reference/src -j2 ARCH=x86-64-avx2 build
          mv reference/src/stockfish reference/src/control_a
          cp reference/src/control_a reference/src/control_b
          make -C candidate/src -j2 ARCH=x86-64-avx2 build
          mv candidate/src/stockfish candidate/src/candidate
          sha256sum reference/src/control_a reference/src/control_b candidate/src/candidate \
            | tee binary-sha256.txt
          sha256sum reference/src/nn-ab28990d4ea3.nnue candidate/src/nn-ab28990d4ea3.nnue \
            | tee network-sha256.txt
          {
            size reference/src/control_a candidate/src/candidate
            readelf -SW reference/src/control_a | grep -F ' .text '
            readelf -SW candidate/src/candidate | grep -F ' .text '
          } | tee binary-layout.txt
      - name: Exact transcripts and calibrated 31-round screen
        run: |
          set -euo pipefail
          python3 lab/tools/lossless_pair_benchmark.py \
            --control-a reference/src/control_a \
            --control-b reference/src/control_b \
            --candidate candidate/src/candidate \
            --options lab/experiments/options/active_fundamentals.json \
            --rounds 31 --metric wall \
            --output "speed-${{ matrix.candidate }}.json" \
            2>&1 | tee "speed-${{ matrix.candidate }}.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: speed-${{ matrix.candidate }}
          retention-days: 90
          if-no-files-found: error
          path: |
            provenance.txt
            candidate-source.patch
            binary-sha256.txt
            network-sha256.txt
            binary-layout.txt
            speed-${{ matrix.candidate }}.json
            speed-${{ matrix.candidate }}.log
