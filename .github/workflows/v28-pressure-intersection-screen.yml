name: Leviathan v2.8 sparse pressure-intersection screen

on:
  push:
    branches: [leviathan/fundamentals-v2.8-pressure-intersection]
    paths: ['.github/workflows/v28-pressure-intersection-screen.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [control, rival64, rival128, boundary96, combo96, combo160]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d
          path: leviathan
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: official-stockfish/Stockfish
          ref: 5062aee519a1ba262d472d8ab139851ced56573e
          path: stockfish
      - name: Apply sparse pressure-intersection profile
        if: matrix.profile != 'control'
        working-directory: leviathan
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          q=os.environ['PROFILE']
          s=Path('src/search.cpp').read_text()

          decl='''    int   priorReduction;\n    Piece movedPiece;'''
          repl='''    int   priorReduction;\n    int   leviathanNullPressure = 0;\n    Piece movedPiece;'''
          if s.count(decl)!=1: raise SystemExit('decl anchor')
          s=s.replace(decl,repl,1)

          anchor='''        Value nullValue = -search<NonPV>(pos, ss + 1, -beta, -beta + 1, depth - R, false);\n\n        undo_null_move(pos);'''
          repl='''        Value nullValue = -search<NonPV>(pos, ss + 1, -beta, -beta + 1, depth - R, false);\n\n        undo_null_move(pos);\n\n        // Leviathan: preserve the already-paid counterfactual. A failed null move\n        // is not just a failed pruning attempt; its distance below beta estimates\n        // how dangerous it would be to surrender a tempo at this node.\n        if (nullValue < beta && !is_decisive(nullValue))\n            leviathanNullPressure = std::clamp(int(beta - nullValue), 0, 512);'''
          if s.count(anchor)!=1: raise SystemExit('null anchor')
          s=s.replace(anchor,repl,1)

          if q.startswith('boundary') or q.startswith('combo'):
              threshold = 96 if q in ('boundary96','combo96') else 160
              anchor='''            // Do a full-depth search when reduced LMR search fails high\n            // (*Scaler) Shallower searches here don't scale well\n            if (value > alpha)'''
              repl=f'''            // Leviathan sparse boundary verification. Stockfish normally\n            // treats an exact-alpha reduced fail-low like any other fail-low.\n            // Verify one extra ply only where the null counterfactual independently\n            // says this node is fragile. This is deliberately capped to early late\n            // moves with non-awful history to avoid global tree inflation.\n            if (value == alpha && leviathanNullPressure >= {threshold} && !capture && !givesCheck\n                && moveCount <= 6 && d + 1 < newDepth && ss->statScore > -3000)\n            {{\n                Depth verifyDepth = std::min(newDepth, d + 1);\n                ss->reduction = newDepth - verifyDepth;\n                value = -search<NonPV>(pos, ss + 1, -(alpha + 1), -alpha, verifyDepth, true);\n                ss->reduction = 0;\n            }}\n\n            // Do a full-depth search when reduced LMR search fails high\n            // (*Scaler) Shallower searches here don't scale well\n            if (value > alpha)'''
              if s.count(anchor)!=1: raise SystemExit('boundary anchor')
              s=s.replace(anchor,repl,1)

          if q.startswith('rival') or q.startswith('combo'):
              threshold = 64 if q in ('rival64','combo96') else 128
              margin = 48 if threshold==64 else 32
              anchor='''                // Reduce other moves if we have found at least one score improvement\n                if (depth > 3 && depth < 12 && !is_decisive(value))\n                    depth -= 3;'''
              repl=f'''                // Leviathan rival preservation. Stockfish normally drops three\n                // plies from every remaining move after any score improvement.\n                // Keep the original depth only when BOTH the improvement is weak\n                // and the failed-null counterfactual says the position is fragile.\n                const bool leviathanFragileGain = leviathanNullPressure >= {threshold}\n                                                && value <= alpha + {margin};\n                if (depth > 3 && depth < 12 && !is_decisive(value) && !leviathanFragileGain)\n                    depth -= 3;'''
              if s.count(anchor)!=1: raise SystemExit('rival anchor')
              s=s.replace(anchor,repl,1)

          Path('src/search.cpp').write_text(s)
          PY
          git diff --check
          git diff -- src/search.cpp
      - run: python3 -m pip install --disable-pip-version-check 'python-chess>=1.999,<2'
      - name: Build AVX2 engines
        run: |
          cd leviathan/src && make net && make clean && make -j2 ARCH=x86-64-avx2 build && mv stockfish leviathan
          cd ../../stockfish/src && make net && make clean && make -j2 ARCH=x86-64-avx2 build && mv stockfish parent
      - name: Configure and generate common diverse panel
        working-directory: leviathan
        run: |
          mkdir -p screen
          cat > screen/a.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":2,"Leviathan Forcing Buyback":384,"Leviathan Recapture Buyback":256,"Leviathan Passer Buyback":320,"Leviathan Endgame Buyback":128,"Leviathan Quiet Overdrive":160,"Leviathan Rule50 Pawn Bonus":3072,"Leviathan Zugzwang Guard":true,"Leviathan Sacrifice Rescue":true,"Leviathan Rule50 Pressure":true,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Risk":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF
          echo '{"Threads":1,"Hash":64}' > screen/b.json
          python3 - <<'PY'
          import random,chess,chess.engine
          from pathlib import Path
          sf=chess.engine.SimpleEngine.popen_uci('../stockfish/src/parent');sf.configure({'Threads':1,'Hash':64})
          O=[];seen=set()
          try:
            for family in range(5):
              r=random.Random(982451653 + family*104729); local=[]
              while len(local)<4:
                b=chess.Board()
                for _ in range(r.randint(8,18)):
                  if b.is_game_over(): break
                  I=sf.analyse(b,chess.engine.Limit(nodes=2200),multipv=min(7,b.legal_moves.count()));I=I if isinstance(I,list) else [I]
                  R=[]
                  for z in I:
                    pv=z.get('pv',[])
                    if pv:R.append((pv[0],int(z['score'].pov(b.turn).score(mate_score=100000) or 0)))
                  if not R:break
                  best=R[0][1];V=[x for x in R if best-x[1]<=130] or R[:1]
                  b.push(r.choices([m for m,_ in V],weights=list(range(len(V),0,-1)),k=1)[0])
                k=' '.join(b.fen().split()[:4])
                if b.is_game_over() or k in seen:continue
                seen.add(k);local.append(b.fen())
              O += local
          finally: sf.quit()
          Path('screen/openings.fen').write_text('\n'.join(O)+'\n')
          PY
      - name: Exact-off gate and active bench
        working-directory: leviathan/src
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          ./leviathan bench 2>&1 | tee ../screen/off-${PROFILE}.txt
          grep -q '2884956' ../screen/off-${PROFILE}.txt
          printf 'setoption name Leviathan Fundamentals value true\nsetoption name Leviathan Fundamentals Authority value 2\nbench\nquit\n' | ./leviathan 2>&1 | tee ../screen/on-${PROFILE}.txt
      - name: 40 equal-node games
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 tools/run_match.py --engine-a "$GITHUB_WORKSPACE/leviathan/src/leviathan" --engine-b "$GITHUB_WORKSPACE/stockfish/src/parent" --options-a screen/a.json --options-b screen/b.json --openings screen/openings.fen --games 40 --nodes-per-move 20000 --max-plies 220 --out screen/nodes-${PROFILE}.json
      - name: 40 fixed-time games
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 tools/run_match.py --engine-a "$GITHUB_WORKSPACE/leviathan/src/leviathan" --engine-b "$GITHUB_WORKSPACE/stockfish/src/parent" --options-a screen/a.json --options-b screen/b.json --openings screen/openings.fen --games 40 --movetime-ms 100 --max-plies 220 --out screen/time-${PROFILE}.json
      - name: Summarize
        working-directory: leviathan
        env: {PROFILE: '${{ matrix.profile }}'}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          q=os.environ['PROFILE'];N=json.loads(Path(f'screen/nodes-{q}.json').read_text())['summary'];T=json.loads(Path(f'screen/time-{q}.json').read_text())['summary'];a=Path(f'screen/off-{q}.txt').read_text();b=Path(f'screen/on-{q}.txt').read_text();g=lambda pat,s:int(re.findall(pat,s)[-1]);om=g(r'Total time \(ms\)\s*:\s*(\d+)',a);am=g(r'Total time \(ms\)\s*:\s*(\d+)',b);on=g(r'Nodes searched\s*:\s*(\d+)',a);an=g(r'Nodes searched\s*:\s*(\d+)',b);R={'profile':q,'equal_node':N,'fixed_time':T,'off_ms':om,'active_ms':am,'speed_ratio':om/am,'off_nodes':on,'active_nodes':an,'node_change_pct':(an/on-1)*100};Path(f'screen/report-{q}.json').write_text(json.dumps(R,indent=2)+'\n');print(json.dumps(R,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v28-${{ matrix.profile }}
          path: |
            leviathan/screen/report-${{ matrix.profile }}.json
            leviathan/screen/nodes-${{ matrix.profile }}.json
            leviathan/screen/time-${{ matrix.profile }}.json
            leviathan/screen/openings.fen
