name: Leviathan Rewrite v2 Strength Probe

on:
  push:
    branches:
      - leviathan/rewrite-v2-bootstrap-strength
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite-v2-strength.yml'
  pull_request:
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite-v2-strength.yml'

jobs:
  build-test-teach-match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build strengthened Leviathan
        run: |
          cmake -S rewrite -B rewrite/build -DCMAKE_BUILD_TYPE=Release
          cmake --build rewrite/build -j2
          ctest --test-dir rewrite/build --output-on-failure

      - name: Build official Stockfish 18
        shell: bash
        run: |
          git clone --depth 1 --branch sf_18 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish18
          make -C /tmp/stockfish18/src -j2 build ARCH=x86-64
          /tmp/stockfish18/src/stockfish bench 16 1 5 default depth >/tmp/sf18-bench.txt
          tail -20 /tmp/sf18-bench.txt

      - name: Install match dependency
        run: python3 -m pip install --disable-pip-version-check chess==1.11.2

      - name: Multi-teacher bootstrap seed
        shell: bash
        run: |
          mkdir -p rewrite/results
          python3 rewrite/tools/label_corpus.py \
            --fen-file rewrite/training/bootstrap_seed.fen \
            --teacher leviathan="$PWD/rewrite/build/leviathan" \
            --teacher stockfish18=/tmp/stockfish18/src/stockfish \
            --movetime 75 \
            --source leviathan-bootstrap-seed \
            --license project_native \
            --output rewrite/results/bootstrap_labels.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('rewrite/results/bootstrap_labels.jsonl')]
          print('teacher positions:', len(rows))
          print('bestmove disagreements:', sum(r['bestmove_disagreement'] for r in rows))
          vals=[r['disagreement_cp'] for r in rows if r['disagreement_cp'] is not None]
          print('mean score disagreement cp:', round(sum(vals)/len(vals),2) if vals else 'n/a')
          PY

      - name: One game vs Stockfish 18
        run: |
          python3 rewrite/tools/uci_match.py \
            --white "$PWD/rewrite/build/leviathan" \
            --black /tmp/stockfish18/src/stockfish \
            --white-name 'Leviathan Rewrite v2' \
            --black-name 'Stockfish 18' \
            --movetime 150 \
            --max-plies 200 \
            --pgn rewrite/results/leviathan-vs-stockfish18.pgn \
            --summary rewrite/results/leviathan-vs-stockfish18.json
          cat rewrite/results/leviathan-vs-stockfish18.pgn
          python3 - <<'PY'
          import json
          p='rewrite/results/leviathan-vs-stockfish18.json'
          d=json.load(open(p))
          print('MATCH_RESULT', d['result'], d['termination'], 'plies=', d['plies'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-v2-strength-probe
          path: rewrite/results/
