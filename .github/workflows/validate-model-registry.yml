name: validate-leviathan

on:
  push:
    paths:
      - 'spec/model-registry.toml'
      - 'spec/omega-transplant.toml'
      - 'spec/architecture.yaml'
      - 'spec/one-agent.yaml'
      - 'scripts/validate_model_registry.py'
      - 'src/leviathan/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-model-registry.yml'
  pull_request:
    paths:
      - 'spec/model-registry.toml'
      - 'spec/omega-transplant.toml'
      - 'spec/architecture.yaml'
      - 'spec/one-agent.yaml'
      - 'scripts/validate_model_registry.py'
      - 'src/leviathan/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-model-registry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Leviathan
        run: python -m pip install -e .
      - name: Validate model registry and Omega references
        run: python scripts/validate_model_registry.py
      - name: Run Leviathan unit tests
        run: python -m unittest discover -s tests -v
