name: validate-model-registry

on:
  push:
    paths:
      - 'spec/**'
      - 'scripts/**'
      - 'src/leviathan/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-model-registry.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'scripts/**'
      - 'src/leviathan/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-model-registry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Leviathan
        run: python -m pip install -e .
      - name: Validate model registry, Omega references, and DeepSeek V4 MoP spec
        run: python scripts/validate_model_registry.py
      - name: Smoke-test prompt runtime CLIs
        run: |
          python scripts/run_prompt.py --help >/dev/null
          python scripts/check_mop0_prompt_parity.py --help >/dev/null
      - name: Run Leviathan unit tests
        run: python -m unittest discover -s tests -v

  mop-cell-reference-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and Leviathan
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e .
      - name: Run exact MoP and parameter-cell reconstruction tests
        run: |
          python -m unittest tests/test_mop0_reference.py -v
          python -m unittest tests/test_parameter_cells.py -v
