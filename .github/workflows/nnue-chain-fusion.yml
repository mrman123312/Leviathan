name: NNUE chain fusion

on:
  push:
    branches:
      - leviathan/speed-v5-nnue-chain-fusion
    paths:
      - .github/workflows/nnue-chain-fusion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/speed-v5-nnue-chain-fusion
          path: experiment
      - name: Checkout frozen Stockfish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: official-stockfish/Stockfish
          ref: 5062aee519a1ba262d472d8ab139851ced56573e
          path: base
      - name: Build fused source tree
        run: |
          cp -a base fused
          cp experiment/tools/apply_nnue_chain_fusion.py fused/tools/apply_nnue_chain_fusion.py
          cd fused
          python3 tools/apply_nnue_chain_fusion.py
          git diff --check
      - name: Build identical AVX2 binaries
        run: |
          cd base/src
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build
          mv stockfish basefish
          cd ../../fused/src
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build
          mv stockfish fusedfish
      - name: Exact semantics and same-runner timing
        run: |
          python3 - <<'PY' | tee chain-fusion.json
          import subprocess,re,json,statistics
          B='./base/src/basefish'; C='./fused/src/fusedfish'
          def run(path):
              p=subprocess.run([path],input='bench\nquit\n',text=True,capture_output=True,check=True)
              o=p.stdout+p.stderr
              return {'nodes':int(re.findall(r'Nodes searched\s*:\s*(\d+)',o)[-1]),
                      'ms':int(re.findall(r'Total time \(ms\)\s*:\s*(\d+)',o)[-1]),
                      'nps':int(re.findall(r'Nodes/second\s*:\s*(\d+)',o)[-1])}
          run(B); run(C); rows=[]
          for i in range(31):
              if i & 1: c=run(C); b=run(B)
              else: b=run(B); c=run(C)
              if b['nodes'] != 2884956 or c['nodes'] != 2884956:
                  raise SystemExit(f'LOSSLESS NODE GATE FAILED base={b} fused={c}')
              rows.append({'base':b,'fused':c,'nps_ratio':c['nps']/b['nps'],'time_speedup':b['ms']/c['ms']})
          R={'rows':rows,
             'median_nps_ratio':statistics.median(x['nps_ratio'] for x in rows),
             'mean_nps_ratio':statistics.mean(x['nps_ratio'] for x in rows),
             'median_time_speedup':statistics.median(x['time_speedup'] for x in rows),
             'faster_pairs':sum(x['fused']['ms'] < x['base']['ms'] for x in rows)}
          print(json.dumps(R,indent=2))
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nnue-chain-fusion
          path: chain-fusion.json
