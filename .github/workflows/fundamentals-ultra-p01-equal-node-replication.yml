name: Fundamentals Ultra P01 Equal-Node Replication

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-p01-equal-node-replication.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-p01-qfrontier, path: leviathan}
      - name: Build Ultra-P01 and pinned current Stockfish
        run: |
          make -C leviathan/src net && make -C leviathan/src clean && make -C leviathan/src -j2 ARCH=x86-64-avx2 build
          git clone -q https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout -q 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Generate 50 fresh balanced opening pairs
        env: {SHARD: '${{ matrix.shard }}'}
        run: |
          seed=$((32452843 + SHARD * 104729))
          python3 lab/tools/generate_balanced_openings.py --stockfish "$RUNNER_TEMP/sf/src/stockfish" --output openings.json --count 50 --plies 14 --seed "$seed" --max-abs-cp 100
          sha256sum openings.json > openings.sha256
      - name: 100-game equal-node shard
        run: |
          mkdir result
          python3 lab/tools/fundamentals_tournament.py --candidate "$PWD/leviathan/src/stockfish" --opponent "$RUNNER_TEMP/sf/src/stockfish" --candidate-label Ultra-P01 --opponent-label Stockfish-5062aee5 --candidate-fundamentals --nodes-per-move 100000 --openings-json "$PWD/openings.json" --max-plies 200 --output-dir result | tee result/match.log
      - name: Provenance
        run: |
          printf 'lab=%s\nleviathan=%s\nstockfish=%s\nopenings=%s\nshard=${{ matrix.shard }}\n' "$(git -C lab rev-parse HEAD)" "$(git -C leviathan rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/sf" rev-parse HEAD)" "$(cut -d' ' -f1 openings.sha256)" > revisions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 'p01-equal-node-replication-${{ matrix.shard }}'
          path: |
            result
            revisions.txt
            openings.sha256
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'p01-equal-node-replication-*', path: shards}
      - name: Aggregate pair-clustered replication
        run: |
          python3 - <<'PY'
          import glob,json,math,random,statistics
          games=[]; pair_scores=[]; shard_summaries=[]
          for d in sorted(glob.glob('shards/p01-equal-node-replication-*')):
              s=json.load(open(d+'/result/summary.json')); shard_summaries.append(s)
              rows=[json.loads(x) for x in open(d+'/result/games.jsonl') if x.strip()]
              games.extend(rows)
              by={}
              for g in rows: by.setdefault(g['opening'],[]).append(g['candidate_score'])
              assert len(by)==50 and all(len(v)==2 for v in by.values())
              pair_scores += [sum(v)/2 for v in by.values()]
          assert len(games)==400 and len(pair_scores)==200
          score=sum(g['candidate_score'] for g in games)/len(games)
          w=sum(g['candidate_score']==1 for g in games); d=sum(g['candidate_score']==.5 for g in games); l=sum(g['candidate_score']==0 for g in games)
          rng=random.Random(8910); boot=[]
          for _ in range(100000): boot.append(statistics.fmean(pair_scores[rng.randrange(len(pair_scores))] for __ in range(len(pair_scores))))
          boot.sort(); lo=boot[2500]; hi=boot[97500]
          elo=400*math.log10(score/(1-score)) if 0<score<1 else None
          out={'schema':'LV_P01_EQUAL_NODE_REPLICATION_V1','games':400,'opening_pairs':200,'wins':w,'draws':d,'losses':l,'score_fraction':score,'naive_logistic_elo':elo,'pair_bootstrap_95pct_score':[lo,hi],'pair_mean':statistics.fmean(pair_scores),'pair_sd':statistics.stdev(pair_scores),'shards':shard_summaries,'rule':'fresh prospective replication; same P01 and Stockfish revisions, 100k nodes/move'}
          open('replication.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-p01-equal-node-replication-aggregate
          path: replication.json
          retention-days: 30
