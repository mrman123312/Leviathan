# Full-stack compile trigger: boundary preservation + Margin Skeptic + TT provenance + rival preservation + ProbCut memory + null fragility + quiet forcing
name: Leviathan strength v5 build

on:
  push:
    branches:
      - leviathan/strength-v5-margin-skeptic
    paths:
      - 'src/**'
      - '.github/workflows/strength-v5-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build AVX2
        working-directory: src
        run: |
          make net
          make clean
          make -j2 ARCH=x86-64-avx2 build

      - name: UCI strength-mode smoke
        working-directory: src
        run: |
          {
            echo uci
            echo 'setoption name Threads value 1'
            echo 'setoption name Hash value 64'
            echo 'setoption name Leviathan Fundamentals value true'
            echo 'setoption name Leviathan Fundamentals Authority value 1'
            echo 'setoption name Leviathan Forcing Buyback value 384'
            echo 'setoption name Leviathan Recapture Buyback value 256'
            echo 'setoption name Leviathan Passer Buyback value 320'
            echo 'setoption name Leviathan Endgame Buyback value 128'
            echo 'setoption name Leviathan Quiet Overdrive value 0'
            echo isready
            echo 'position startpos moves e2e4 e7e5 g1f3 b8c6 f1b5'
            echo 'go depth 12'
            echo quit
          } | ./stockfish | tee ../strength-v5-smoke.txt
          grep -q '^bestmove ' ../strength-v5-smoke.txt

      - name: Archive smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: strength-v5-build-smoke
          path: strength-v5-smoke.txt
          if-no-files-found: error
