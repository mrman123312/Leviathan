name: P07 Lean Champion Screen

on:
  push:
    branches: [agent/p07-lean-champion-screen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lossless-speed:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact P03 candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: cand
          fetch-depth: 1

      - name: Checkout exact P03 control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e03466d02cc4214442e2ff82fb1a2f28b2d29186
          path: base
          fetch-depth: 1

      - name: Checkout benchmark harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/fundamentals-ultra-lab
          path: harness
          fetch-depth: 1

      - name: Materialize champion-only dead-organ elimination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cand/src/search.cpp'); s=p.read_text()
          old="    const bool leviathanRiskReady  = Leviathan::Control::risk_ready();\n    const bool leviathanDslReady   = Leviathan::DSL::ready();\n    const bool leviathanTraceReady = Leviathan::Trace::ready();"
          new="    // Lean Champion: these experimental organs are disabled in the proven\n    // production configuration. Make that compile-time knowledge so their\n    // readiness probes and downstream branches disappear from the hot search.\n    constexpr bool leviathanRiskReady  = false;\n    constexpr bool leviathanDslReady   = false;\n    constexpr bool leviathanTraceReady = false;"
          if s.count(old)!=1: raise SystemExit('search dead-organ anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('cand/src/movepick.cpp'); s=p.read_text()
          old="    const bool leviathanPolicyReady = Type == QUIETS && Leviathan::Policy::ready();\n    const bool leviathanAtlasReady  = Type == QUIETS && Leviathan::Atlas::ready();"
          new="    // Lean Champion configuration has both optional learned ordering organs off.\n    constexpr bool leviathanPolicyReady = false;\n    constexpr bool leviathanAtlasReady  = false;"
          if s.count(old)!=1: raise SystemExit('movepick dead-organ anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          git -C cand diff --check
          git -C cand diff -- src/search.cpp src/movepick.cpp

      - name: Build P03 controls and lean candidate
        run: |
          make -C base/src net
          make -C base/src clean
          make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/control_a
          cp base/src/stockfish base/src/control_b
          cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C cand/src clean
          make -C cand/src -j2 ARCH=x86-64-avx2 build
          cat > active.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Risk":false,"Leviathan Policy":false,"Leviathan MetaSearch":false,"Leviathan Specialist":false,"Leviathan Atlas":false,"Leviathan Search DSL":false}
          EOF

      - name: Exact behavior and calibrated speed screen
        run: |
          python3 harness/tools/lossless_pair_benchmark.py \
            --control-a base/src/control_a \
            --control-b base/src/control_b \
            --candidate cand/src/stockfish \
            --options active.json \
            --rounds 31 \
            --output p07-lean.json | tee p07-lean.log

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('p07-lean.json')); sig=d['signatures']; r=d['results']; exact=True
          for case in ('default','depth11','nodes50k'):
              a=sig['control_a'][case]; c=sig['candidate'][case]
              exact &= a['nodes']==c['nodes'] and a['behavior_sha256']==c['behavior_sha256']
          c=r['candidate']; a=r['control_b']
          out={'exact_champion_behavior':exact,'aa_median':a['median_speedup'],'aa_ci':a['bootstrap_median_95pct_ci'],'candidate_median':c['median_speedup'],'candidate_geo':c['geometric_mean_speedup'],'candidate_ci':c['bootstrap_median_95pct_ci'],'faster_rounds':c['faster_rounds'],'rounds':c['rounds']}
          open('p07-summary.json','w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          if not exact: raise SystemExit('BEHAVIOR_MISMATCH')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p07-lean-${{ github.sha }}
          path: |
            p07-lean.json
            p07-lean.log
            p07-summary.json
          retention-days: 30
