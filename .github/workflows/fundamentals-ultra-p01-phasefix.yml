name: Fundamentals Ultra P01 PhaseFix Transfer
on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-p01-phasefix.yml']
permissions: {contents: write}
jobs:
  transfer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-v2.1.1-phasefix, path: base, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-lab, path: lab}
      - name: Apply exact P01 transform
        run: |
          cp -a base cand
          cp lab/tools/apply_p01.py cand/tools/apply_p01.py
          (cd cand && python3 tools/apply_p01.py && git diff --check)
      - name: Build controls and candidate
        run: |
          make -C base/src net; cp base/src/nn-ab28990d4ea3.nnue cand/src/
          make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          cp base/src/stockfish base/src/a; cp base/src/stockfish base/src/b
          make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
          cat > options.json <<'EOF'
          {"Threads":1,"Hash":64,"Leviathan Fundamentals":true,"Leviathan Fundamentals Authority":1,"Leviathan Quiet Overdrive":0,"Leviathan Search DSL":false,"Leviathan Risk":false,"Leviathan Atlas":false,"Leviathan Policy":false}
          EOF
      - name: 15-round exact-behavior same-runner speed gate
        run: |
          python3 lab/tools/lossless_pair_benchmark.py --control-a base/src/a --control-b base/src/b --candidate cand/src/stockfish --options options.json --rounds 15 --output speed.json | tee speed.log
      - name: Publish source candidate
        working-directory: cand
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B leviathan/fundamentals-ultra-phasefix-p01
          git add src/leviathan_dsl.h src/leviathan_trace.h src/movepick.cpp src/search.cpp
          git commit -m 'Ultra: phase-fix plus lossless P0+P1 fast paths'
          git push --force origin HEAD:leviathan/fundamentals-ultra-phasefix-p01
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals-ultra-phasefix-p01
          path: |
            speed.json
            speed.log
            options.json
          retention-days: 30
