name: Leviathan v2.3 pressure-piece interleaved speed
on:
  push:
    branches: [leviathan/h2h-v22-100-20260815]
    paths: ['.github/workflows/v23-pressurepiece-speed.yml']
permissions: {contents: read}
jobs:
  speed:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: b8cbdcbed9bb8bc28b62b3a7b98a5a07d3442f3e}
      - name: Apply pressure-piece allocator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/leviathan_fundamentals.h'); s=h.read_text()
          a='''                          Depth depth,\n                          int moveCount,'''; b='''                          Depth depth,\n                          Value staticEval,\n                          int moveCount,'''
          x='''        delta += 1024 + state().quietOverdrive * lateness * depthScale / 24;\n        if (moveCount >= 10 && depth >= 7)\n            delta += 256;'''
          y='''        const int evalCp = staticEval == VALUE_NONE ? 0 : int(staticEval);\n        int evalBudget = evalCp >= 150 ? 960 : evalCp >= 0 ? 672 : evalCp >= -150 ? 384 : 128;\n        const int pieceCap =\n          (m.pt == KNIGHT || m.pt == BISHOP) ? 896 :\n          (m.pt == ROOK || m.pt == QUEEN)    ? 384 :\n          m.king                              ? 128 : 512;\n        int hardBudget = std::min(evalBudget, pieceCap);\n        if (moveCount < 8 || depth < 6) hardBudget = std::min(hardBudget, 320);\n        delta += hardBudget + state().quietOverdrive * lateness * depthScale / 24;\n        if (evalCp >= 100 && (m.pt == KNIGHT || m.pt == BISHOP) && moveCount >= 11 && depth >= 8) delta += 128;'''
          assert s.count(a)==1 and s.count(x)==1; h.write_text(s.replace(a,b,1).replace(x,y,1))
          p=Path('src/search.cpp'); t=p.read_text()
          c='''        r += Leviathan::Fundamentals::lmr_adjustment(\n          pos, move, prevSq, depth, moveCount, PvNode, capture, givesCheck);'''
          d='''        r += Leviathan::Fundamentals::lmr_adjustment(\n          pos, move, prevSq, depth, ss->staticEval, moveCount, PvNode, capture, givesCheck);'''
          assert t.count(c)==1; p.write_text(t.replace(c,d,1))
          PY
      - name: Build
        working-directory: src
        run: make net && make -j2 ARCH=x86-64-avx2 build
      - name: 11 alternating pairs
        working-directory: src
        run: |
          python3 - <<'PY' | tee ../pressurepiece-speed.txt
          import subprocess,re,statistics,json
          def R(on):
            q=('setoption name Leviathan Fundamentals value true\nsetoption name Leviathan Fundamentals Authority value 2\n' if on else '')+'bench\nquit\n'
            p=subprocess.run(['./stockfish'],input=q,text=True,capture_output=True,check=True); o=p.stdout+p.stderr
            return {k:int(re.findall(pat,o)[-1]) for k,pat in [('ms',r'Total time \(ms\)\s*:\s*(\d+)'),('nodes',r'Nodes searched\s*:\s*(\d+)'),('nps',r'Nodes/second\s*:\s*(\d+)')]}
          R(0);R(1); P=[]
          for i in range(11):
            if i%2: on=R(1);off=R(0)
            else: off=R(0);on=R(1)
            P.append({'off':off,'on':on}); print(i+1,off,on)
          ratio=[p['off']['ms']/p['on']['ms'] for p in P]; nr=[p['on']['nodes']/p['off']['nodes'] for p in P]
          q={'pairs':P,'off_median_ms':statistics.median(p['off']['ms'] for p in P),'on_median_ms':statistics.median(p['on']['ms'] for p in P),'median_speedup':statistics.median(ratio),'mean_speedup':statistics.mean(ratio),'node_reduction_pct':(1-statistics.median(nr))*100}
          print(json.dumps(q,indent=2)); open('../pressurepiece-speed.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v23-pressurepiece-interleaved-speed
          path: |
            pressurepiece-speed.txt
            pressurepiece-speed.json
