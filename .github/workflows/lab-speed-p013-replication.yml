name: Leviathan strict P013 speed replication

on:
  push:
    branches: [leviathan/lab-v4-speed-replication]
    paths:
      - '.github/workflows/lab-speed-p013-replication.yml'
      - 'tools/lossless_pair_benchmark.py'
      - 'experiments/options/active_fundamentals.json'
      - 'experiments/manifests/speed_p013_replication.json'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: lab-speed-p013-replication-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  strict-replication:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - panel: active-reference
            reference: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d
          - panel: p3-increment
            reference: a38620d49cd28d0f1bddd776658dda4b47dd4c96
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: lab
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.reference }}
          path: reference
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e157b9332a0c71263b57b39757b22431e3f7f31c
          path: candidate
      - name: Record immutable provenance
        run: |
          set -euo pipefail
          {
            echo "panel=${{ matrix.panel }}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            uname -a
            lscpu
            g++ --version
            git -C lab rev-parse HEAD
            git -C lab rev-parse 'HEAD^{tree}'
            git -C reference rev-parse HEAD
            git -C reference rev-parse 'HEAD^{tree}'
            git -C candidate rev-parse HEAD
            git -C candidate rev-parse 'HEAD^{tree}'
            sha256sum lab/tools/lossless_pair_benchmark.py
            sha256sum lab/experiments/options/active_fundamentals.json
            sha256sum lab/experiments/manifests/speed_p013_replication.json
          } | tee provenance.txt
          set +e
          diff -ru --exclude='*.nnue' reference/src candidate/src > candidate-source.patch
          diff_status=$?
          set -e
          if (( diff_status > 1 )); then exit "$diff_status"; fi
          test -s candidate-source.patch
      - name: Build frozen reference and candidate
        run: |
          set -euo pipefail
          make -C reference/src net
          cp reference/src/nn-ab28990d4ea3.nnue candidate/src/
          make -C reference/src -j2 ARCH=x86-64-avx2 build
          mv reference/src/stockfish reference/src/control_a
          cp reference/src/control_a reference/src/control_b
          make -C candidate/src -j2 ARCH=x86-64-avx2 build
          mv candidate/src/stockfish candidate/src/candidate
          sha256sum reference/src/control_a reference/src/control_b candidate/src/candidate \
            | tee binary-sha256.txt
          sha256sum reference/src/nn-ab28990d4ea3.nnue candidate/src/nn-ab28990d4ea3.nnue \
            | tee network-sha256.txt
      - name: Strict transcript gates and calibrated 31-round replication
        run: |
          set -euo pipefail
          python3 lab/tools/lossless_pair_benchmark.py \
            --control-a reference/src/control_a \
            --control-b reference/src/control_b \
            --candidate candidate/src/candidate \
            --options lab/experiments/options/active_fundamentals.json \
            --rounds 31 --output "speed-p013-${{ matrix.panel }}.json" \
            2>&1 | tee "speed-p013-${{ matrix.panel }}.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: speed-p013-${{ matrix.panel }}
          retention-days: 90
          if-no-files-found: error
          path: |
            provenance.txt
            candidate-source.patch
            binary-sha256.txt
            network-sha256.txt
            speed-p013-${{ matrix.panel }}.json
            speed-p013-${{ matrix.panel }}.log

