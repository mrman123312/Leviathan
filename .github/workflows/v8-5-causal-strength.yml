    runs-on: ubuntu-22.04
    steps:
      - name: Checkout combined A+B
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5541261dccec82d7c76dcb8298d8ce7bd8f69b9a
          path: ab
      - name: Checkout hygiene A
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
