          PY
      - name: Fixed-time B vs control
        if: steps.en.outputs.survives == 'true'
        run: |
          set -euo pipefail
          python3 b/tools/run_match.py --engine-a "$GITHUB_WORKSPACE/b/src/stockfish-b" --engine-b "$GITHUB_WORKSPACE/c/src/stockfish-c" --options-a match/options.json --options-b match/options.json --openings match/openings.fen --games 40 --movetime-ms 50 --max-plies 220 --out match/fixed-time.json | tee match/fixed-time.log
      - name: Summarize B
        if: always() && steps.en.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json,pathlib;r={'comparison':'receipt_vs_control','equal_node':json.load(open('match/equal-node.json'))['summary'],'fixed_time':json.load(open('match/fixed-time.json'))['summary'] if pathlib.Path('match/fixed-time.json').exists() else None};pathlib.Path('match/summary.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
