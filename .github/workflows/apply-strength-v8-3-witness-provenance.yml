name: Apply strength v8.3 witness provenance

on:
  push:
    branches:
      - leviathan/strength-v8-evidence-lattice
    paths:
      - '.github/workflows/apply-strength-v8-3-witness-provenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout strength v8
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: leviathan/strength-v8-evidence-lattice

      - name: Bind witness identity to causal evidence
        run: |
          python3 tools/leviathan_apply_v8_3_witness_provenance.py
          git diff --check
          git diff -- src/search.h src/search.cpp

      - name: Commit witness provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/search.h src/search.cpp
          git commit -m 'Strength v8.3: bind proof witnesses to causal provenance'
          git push origin HEAD:leviathan/strength-v8-evidence-lattice
