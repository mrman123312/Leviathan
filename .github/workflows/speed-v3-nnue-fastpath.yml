name: Leviathan speed v3 NNUE fast path

on:
  push:
    branches: [leviathan/speed-v3-profile]
    paths: ['.github/workflows/speed-v3-nnue-fastpath.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-speed:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d
          path: candidate
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fbccfb6eb5cd335b1ce8fc5c5efad9e36be4e19d
          path: reference
      - name: Specialize dominant accumulator shape
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nnue/nnue_accumulator.cpp');s=p.read_text()
          anchor='''    vec_t      acc[Tiling::NumRegs];\n    psqt_vec_t psqt[Tiling::NumPsqtRegs];\n\n    for (IndexType j = 0; j < Dimensions / Tiling::TileHeight; ++j)'''
          fast='''    vec_t      acc[Tiling::NumRegs];\n    psqt_vec_t psqt[Tiling::NumPsqtRegs];\n\n    // Leviathan lossless NNUE fast lane: ~20% of incremental updates on the\n    // measured bench are a simple piece relocation with no threat deltas.\n    // Preserve Stockfish's exact arithmetic order: base - removed + added.\n    if (psqAdded.ssize() == 1 && psqRemoved.ssize() == 1\n        && thrAdded.ssize() == 0 && thrRemoved.ssize() == 0)\n    {\n        const IndexType addIndex = psqAdded[0];\n        const IndexType remIndex = psqRemoved[0];\n        for (IndexType j = 0; j < Dimensions / Tiling::TileHeight; ++j)\n        {\n            const usize tileOff = j * Tiling::TileHeight;\n            auto* fromTile = reinterpret_cast<const vec_t*>(&fromAcc[tileOff]);\n            auto* toTile = reinterpret_cast<vec_t*>(&toAcc[tileOff]);\n            auto* rem = reinterpret_cast<const vec_t*>(&featureTransformer.weights[remIndex * Dimensions + tileOff]);\n            auto* add = reinterpret_cast<const vec_t*>(&featureTransformer.weights[addIndex * Dimensions + tileOff]);\n            for (IndexType k = 0; k < Tiling::NumRegs; ++k)\n                vec_store(&toTile[k], vec_add_16(vec_sub_16(fromTile[k], rem[k]), add[k]));\n        }\n        for (IndexType j = 0; j < PSQTBuckets / Tiling::PsqtTileHeight; ++j)\n        {\n            const usize off = j * Tiling::PsqtTileHeight;\n            auto* fromTile = reinterpret_cast<const psqt_vec_t*>(&fromPsqtAcc[off]);\n            auto* toTile = reinterpret_cast<psqt_vec_t*>(&toPsqtAcc[off]);\n            auto* rem = reinterpret_cast<const psqt_vec_t*>(&featureTransformer.psqtWeights[remIndex * PSQTBuckets + off]);\n            auto* add = reinterpret_cast<const psqt_vec_t*>(&featureTransformer.psqtWeights[addIndex * PSQTBuckets + off]);\n            for (IndexType k = 0; k < Tiling::NumPsqtRegs; ++k)\n                vec_store_psqt(&toTile[k], vec_add_psqt_32(vec_sub_psqt_32(fromTile[k], rem[k]), add[k]));\n        }\n        return;\n    }\n\n    for (IndexType j = 0; j < Dimensions / Tiling::TileHeight; ++j)'''
          if anchor not in s: raise SystemExit('anchor missing')
          p.write_text(s.replace(anchor,fast,1))
          PY
      - name: Build AVX2
        run: |
          cd candidate/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish candidate
          cd ../../reference/src && make net && make -j2 ARCH=x86-64-avx2 build && mv stockfish reference
      - name: Verify exact nodes and measure 21 alternating pairs
        run: |
          python3 - <<'PY' | tee nnue-fastpath.txt
          import json,re,statistics,subprocess
          opts=['setoption name Threads value 1','setoption name Hash value 64','setoption name Leviathan Fundamentals value true','setoption name Leviathan Fundamentals Authority value 2','setoption name Leviathan Policy value false','setoption name Leviathan MetaSearch value false','setoption name Leviathan Risk value false','setoption name Leviathan Specialist value false','setoption name Leviathan Atlas value false','setoption name Leviathan Search DSL value false']
          cfg='\n'.join(opts)+'\n'
          def R(p):
            z=subprocess.run([p],input=cfg+'bench\nquit\n',text=True,capture_output=True,check=True);o=z.stdout+z.stderr
            return {'ms':int(re.findall(r'Total time \(ms\)\s*:\s*(\d+)',o)[-1]),'nodes':int(re.findall(r'Nodes searched\s*:\s*(\d+)',o)[-1]),'nps':int(re.findall(r'Nodes/second\s*:\s*(\d+)',o)[-1])}
          ref='./reference/src/reference';cand='./candidate/src/candidate';R(ref);R(cand);P=[]
          for i in range(21):
            if i%2:c=R(cand);r=R(ref)
            else:r=R(ref);c=R(cand)
            if r['nodes']!=c['nodes']:raise SystemExit(f'DIVERGENCE {r} {c}')
            P.append({'reference':r,'candidate':c});print(i+1,r,c,r['ms']/c['ms'])
          q=[x['reference']['ms']/x['candidate']['ms'] for x in P]
          out={'pairs':P,'nodes':P[0]['reference']['nodes'],'median_speedup':statistics.median(q),'mean_speedup':statistics.mean(q),'reference_median_ms':statistics.median(x['reference']['ms'] for x in P),'candidate_median_ms':statistics.median(x['candidate']['ms'] for x in P)}
          open('nnue-fastpath.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: speed-v3-nnue-fastpath
          path: |
            nnue-fastpath.json
            nnue-fastpath.txt
