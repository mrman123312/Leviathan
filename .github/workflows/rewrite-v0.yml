name: Leviathan Rewrite

on:
  push:
    branches:
      - leviathan/rewrite-v0-greenfield
      - leviathan/rewrite-v1-donor-ecology
      - leviathan/rewrite-v3-three-loop-optimization
      - leviathan/rewrite-v4-dual-training-data
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite-v0.yml'
  pull_request:
    paths:
      - 'rewrite/**'
      - '.github/workflows/rewrite-v0.yml'

jobs:
  greenfield-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S rewrite -B rewrite/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build rewrite/build -j2
      - name: Self-test and donor audit
        run: ctest --test-dir rewrite/build --output-on-failure
      - name: Training-data provenance audit
        run: |
          python3 rewrite/tools/audit_training_data.py
          python3 rewrite/tools/fetch_training_data.py --list
      - name: UCI smoke
        shell: bash
        run: |
          output=$(printf 'uci\nisready\nposition startpos\nperft 4\ngo depth 3\nquit\n' | rewrite/build/leviathan)
          printf '%s\n' "$output"
          grep -q 'uciok' <<<"$output"
          grep -q 'readyok' <<<"$output"
          grep -q 'nodes 197281' <<<"$output"
          grep -q '^bestmove ' <<<"$output"

  deep-correctness-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install independent chess oracle
        run: python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Build release audit engine
        run: |
          cmake -S rewrite -B rewrite/build-audit -DCMAKE_BUILD_TYPE=Release
          cmake --build rewrite/build-audit -j2
      - name: Differential legal-move and perft audit
        run: |
          python3 rewrite/tools/differential_audit.py \
            --engine "$PWD/rewrite/build-audit/leviathan" \
            --seed 8910 --positions 160 --perft-positions 80 --perft-depth 2
      - name: Build ASan and UBSan engine
        shell: bash
        run: |
          cmake -S rewrite -B rewrite/build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build rewrite/build-sanitize -j2
      - name: Sanitizer self-test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: rewrite/build-sanitize/leviathan --selftest

  fathom-donor-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Fathom donor
        run: python3 rewrite/tools/materialize_source.py rewrite/donors/locks/fathom.json --output-dir rewrite/.donor-cache
      - name: Configure with Fathom
        shell: bash
        run: |
          cmake -S rewrite -B rewrite/build-fathom \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEVIATHAN_FATHOM_DIR="$PWD/rewrite/.donor-cache/fathom/c9c6fef0dddc05d2e242c183acf5833149ab676d"
      - name: Build with Fathom
        run: cmake --build rewrite/build-fathom -j2
      - name: Core tests with donor linked
        run: ctest --test-dir rewrite/build-fathom --output-on-failure
