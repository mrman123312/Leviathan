name: Fundamentals Ultra QDepth Frontier

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-qdepth-frontier.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        mode: [fixed4, historical, modern46, modern35]
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: cand}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: base}

      - name: Restore qPly state and materialize adaptive frontier
        if: matrix.mode != 'fixed4'
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          mode=os.environ['MODE']
          h=Path('cand/src/search.h');s=h.read_text()
          old='Value qsearch(Position& pos, Stack* ss, Value alpha, Value beta);'
          new='Value qsearch(Position& pos, Stack* ss, Value alpha, Value beta, int qPly);'
          if s.count(old)!=1: raise SystemExit('header qsearch anchor')
          h.write_text(s.replace(old,new,1))

          p=Path('cand/src/search.cpp');s=p.read_text()
          pairs=[
            ('return qsearch<PvNode ? PV : NonPV>(pos, ss, alpha, beta);','return qsearch<PvNode ? PV : NonPV>(pos, ss, alpha, beta, 0);','entry'),
            ('Value Search::Worker::qsearch(Position& pos, Stack* ss, Value alpha, Value beta) {','Value Search::Worker::qsearch(Position& pos, Stack* ss, Value alpha, Value beta, int qPly) {','definition'),
            ('value = -qsearch<nodeType>(pos, ss + 1, -beta, -alpha);','value = -qsearch<nodeType>(pos, ss + 1, -beta, -alpha, qPly + 1);','recursive')]
          for old,new,label in pairs:
            if s.count(old)!=1: raise SystemExit(label+' anchor')
            s=s.replace(old,new,1)

          pattern=r'(?m)^(\s*)if \(moveCount > 4 \|\| \(moveCount > 2 && leviathanCaptureCeiling < alpha - 48\)\)\n\s*continue;'
          m=re.search(pattern,s)
          if not m: raise SystemExit('frontier regex anchor')
          I=m.group(1)
          if mode=='historical':
            body=[
              '// Restore the original information shape: tactical distance is',
              '// a pruning variable again, with bounded growth for modern qsearch.',
              'const int leviathanQCap = 2 + std::min(qPly, 4);']
          elif mode=='modern46':
            body=[
              '// Keep Ultra-v0 cap4 at the horizon, then widen only after an',
              '// actual tactical continuation has already justified qsearch work.',
              'const int leviathanQCap = 4 + std::min(qPly, 2);']
          elif mode=='modern35':
            body=[
              '// Selective reconstruction: cap3 at the horizon, widening only',
              '// as tactical continuation depth proves the frontier is live.',
              'const int leviathanQCap = 3 + std::min(qPly, 2);']
          else: raise SystemExit(mode)
          repl='\n'.join(I+x for x in body)+f'''\n{I}if (moveCount > leviathanQCap\n{I}    || (moveCount > 2 && leviathanCaptureCeiling < alpha - 48))\n{I}    continue;'''
          s=s[:m.start()]+repl+s[m.end():]
          p.write_text(s)
          PY
          git -C cand diff --check
          git -C cand diff -- src/search.cpp src/search.h | tee mutation.patch

      - name: Build candidate, baseline, and current Stockfish
        run: |
          make -C cand/src net && make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
          make -C base/src net && make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          git clone -q https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout -q 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2

      - name: Fresh 40-position holdout
        run: python3 lab/tools/generate_balanced_openings.py --stockfish "$RUNNER_TEMP/sf/src/stockfish" --output openings.json --count 40 --plies 14 --seed 141421356 --max-abs-cp 110

      - name: 80 equal-node games
        run: |
          mkdir nodes
          python3 lab/tools/fundamentals_tournament.py --candidate "$PWD/cand/src/stockfish" --opponent "$PWD/base/src/stockfish" --candidate-label '${{ matrix.mode }}' --opponent-label Ultra-v0 --candidate-fundamentals --opponent-fundamentals --nodes-per-move 90000 --openings-json openings.json --max-plies 190 --output-dir nodes | tee nodes/match.log

      - name: 80 fixed-time games
        run: |
          mkdir time
          python3 lab/tools/fundamentals_tournament.py --candidate "$PWD/cand/src/stockfish" --opponent "$PWD/base/src/stockfish" --candidate-label '${{ matrix.mode }}' --opponent-label Ultra-v0 --candidate-fundamentals --opponent-fundamentals --move-time-ms 120 --openings-json openings.json --max-plies 190 --output-dir time | tee time/match.log

      - name: Hardened isolated deep-oracle regret
        run: python3 lab/tools/oracle_regret.py --candidate "$PWD/cand/src/stockfish" --baseline "$PWD/base/src/stockfish" --oracle "$RUNNER_TEMP/sf/src/stockfish" --openings-json openings.json --candidate-label '${{ matrix.mode }}' --candidate-fundamentals --baseline-fundamentals --choice-nodes 120000 --oracle-nodes 800000 --output regret.json | tee regret.log

      - uses: actions/upload-artifact@v4
        with:
          name: 'qdepth-${{ matrix.mode }}'
          path: |
            nodes
            time
            regret.json
            regret.log
            openings.json
            mutation.patch
          retention-days: 30
