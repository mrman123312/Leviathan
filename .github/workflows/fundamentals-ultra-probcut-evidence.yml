name: Fundamentals Ultra ProbCut Evidence Memory

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-probcut-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openings:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - name: Fresh holdout
        run: |
          git clone -q https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout -q 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2
          python3 lab/tools/generate_balanced_openings.py --stockfish "$RUNNER_TEMP/sf/src/stockfish" --output openings.json --count 50 --plies 16 --seed 141421356 --max-abs-cp 110
          sha256sum openings.json > openings.sha256
      - uses: actions/upload-artifact@v4
        with: {name: probcut-evidence-openings, path: 'openings.*', retention-days: 30}

  screen:
    needs: openings
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: control, mode: control}
          - {label: near-order, mode: order}
          - {label: near-order-depth, mode: depth}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: cand}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-v0, path: base}
      - uses: actions/download-artifact@v4
        with: {name: probcut-evidence-openings, path: shared}
      - name: Materialize paid-evidence memory
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          mode=os.environ['MODE']; p=Path('cand/src/search.cpp'); s=p.read_text()
          if mode!='control':
            reps=[]
            reps.append((
              'Move  move, excludedMove, bestMove;\n    Depth extension, newDepth;\n    Value bestValue, value, eval, maxValue, probCutBeta;',
              'Move  move, excludedMove, bestMove, probCutNearMiss;\n    Depth extension, newDepth;\n    Value bestValue, value, eval, maxValue, probCutBeta, probCutNearValue;'))
            reps.append((
              'bestMove       = Move::none();\n    priorReduction = (ss - 1)->reduction;',
              'bestMove         = Move::none();\n    probCutNearMiss  = Move::none();\n    probCutNearValue = -VALUE_INFINITE;\n    priorReduction   = (ss - 1)->reduction;'))
            old='''            if (value >= probCutBeta)
            {
                // Save ProbCut data into transposition table
                ttWriter.write(posKey, value_to_tt(value, ss->ply), ss->ttPv, BOUND_LOWER,
                               probCutDepth + 1, move, unadjustedStaticEval, tt.generation());

                if (!is_decisive(value))
                    return value - (probCutBeta - beta);
            }'''
            new=old+'''
            else if (value >= beta && !is_decisive(value) && value > probCutNearValue)
            {
                // ProbCut already paid to establish that this tactical move is
                // stronger than beta, even though it missed ProbCut's safety margin.
                // Preserve that evidence without granting it cutoff authority.
                probCutNearValue = value;
                probCutNearMiss  = move;
            }'''
            reps.append((old,new))
            reps.append((
              'MovePicker mp(pos, ttData.move, depth, &mainHistory, &lowPlyHistory, &captureHistory, contHist,\n                  &sharedHistory, ss->ply);',
              'const Move leviathanPreferredMove = ttData.move ? ttData.move : probCutNearMiss;\n    MovePicker mp(pos, leviathanPreferredMove, depth, &mainHistory, &lowPlyHistory, &captureHistory,\n                  contHist, &sharedHistory, ss->ply);'))
            if mode=='depth':
              reps.append((
                'r += 697;  // Base reduction offset to compensate for other tweaks\n        r -= moveCount * 65;',
                'r += 697;  // Base reduction offset to compensate for other tweaks\n        if (move == probCutNearMiss)\n            r -= 256;  // small buyback only for the already-paid tactical near-proof\n        r -= moveCount * 65;'))
            for a,b in reps:
              if s.count(a)!=1: raise SystemExit(f'anchor count={s.count(a)} for {a[:60]!r}')
              s=s.replace(a,b,1)
            p.write_text(s)
          PY
          git -C cand diff --check
          git -C cand diff -- src/search.cpp | tee mutation.patch
      - name: Build candidate, control and pinned Stockfish
        run: |
          make -C cand/src net && make -C cand/src clean && make -C cand/src -j2 ARCH=x86-64-avx2 build
          make -C base/src net && make -C base/src clean && make -C base/src -j2 ARCH=x86-64-avx2 build
          git clone -q https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout -q 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: 100-game equal-node screen
        run: |
          mkdir nodes
          python3 lab/tools/fundamentals_tournament.py --candidate "$PWD/cand/src/stockfish" --opponent "$PWD/base/src/stockfish" --candidate-label '${{ matrix.label }}' --opponent-label Ultra-v0 --candidate-fundamentals --opponent-fundamentals --nodes-per-move 100000 --openings-json "$PWD/shared/openings.json" --max-plies 200 --output-dir nodes | tee nodes/match.log
      - name: Hardened isolated-oracle screen
        run: |
          python3 lab/tools/oracle_regret.py --candidate "$PWD/cand/src/stockfish" --baseline "$PWD/base/src/stockfish" --oracle "$RUNNER_TEMP/sf/src/stockfish" --openings-json "$PWD/shared/openings.json" --candidate-label '${{ matrix.label }}' --candidate-fundamentals --baseline-fundamentals --choice-nodes 120000 --oracle-nodes 800000 --output regret.json | tee regret.log
          grep -q 'LV_ISOLATED_ROOT_REGRET_V2' regret.json
      - uses: actions/upload-artifact@v4
        with:
          name: 'probcut-evidence-${{ matrix.label }}'
          path: |
            nodes
            regret.json
            regret.log
            mutation.patch
            shared/openings.sha256
          retention-days: 30
