name: consumer-reference
on:
  push:
    branches: [qwen-nrdf-consumer, master]
    paths: ['src/**', 'tests/**', 'scripts/**', 'spec/**', 'pyproject.toml', '.github/workflows/consumer-reference.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'spec/**', 'pyproject.toml', '.github/workflows/consumer-reference.yml']
permissions:
  contents: read
concurrency:
  group: consumer-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU reference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install -e . numpy 'transformers==5.8.1' accelerate safetensors
      - name: Check all architecture paths and native tiny Qwen integration
        run: |
          set -o pipefail
          mkdir -p evidence/consumer
          python scripts/validate_model_registry.py
          python -m unittest discover -s tests -v 2>&1 | tee evidence/consumer/ci-tests.txt
          python scripts/run_prompt.py --help > /dev/null
          python scripts/train_consumer_graft.py --help > /dev/null
          python scripts/check_consumer_hf.py --output evidence/consumer/hf-tiny.json
      - name: Package exact source
        if: always()
        run: git archive --format=zip HEAD -o evidence/consumer/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-evidence-${{ github.sha }}
          path: evidence/consumer/
          retention-days: 14
