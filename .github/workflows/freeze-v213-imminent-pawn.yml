name: Freeze v2.1.3 imminent-pawn allocator
on:
  push:
    branches: [leviathan/fundamentals-v2.1.3-imminent-pawn]
    paths: ['.github/workflows/freeze-v213-imminent-pawn.yml']
permissions: {contents: write}
jobs:
  freeze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: leviathan/fundamentals-v2.1.3-imminent-pawn}
      - name: Apply imminent-pawn gradient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/leviathan_fundamentals.h');s=p.read_text()
          old='''inline bool advanced_pawn_move(const Position& pos, Move move) {\n    return pawn_move(pos, move) && relative_rank(mover_color(pos, move), move.to_sq()) >= RANK_6;\n}'''
          new='''inline bool advanced_pawn_move(const Position& pos, Move move) {\n    if (!pawn_move(pos, move))\n        return false;\n    const Rank rr = relative_rank(mover_color(pos, move), move.to_sq());\n    // Imminence is contextual: seventh-rank moves are always critical; a\n    // sixth-rank pawn becomes critical in sparse positions where promotion\n    // timing and king routes dominate. Ordinary pawn moves still fund speed.\n    return rr >= RANK_7 || (rr >= RANK_6 && low_material(pos));\n}'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old2='''    // Authority 2 is the funding mechanism. v2.1 deliberately avoids\n    // overdriving pawn moves: even a quiet pawn move irreversibly changes the\n    // position and is a poor place to buy generic speed. We also start one move\n    // later and one ply deeper than v2 to concentrate the extra reduction on\n    // genuinely late, stable-looking branches.\n    if (state().authority >= 2 && depth >= 5 && moveCount >= 6 && !pvNode && !capture\n        && !givesCheck && move.type_of() != PROMOTION && !advanced_pawn_move(pos, move)\n        && !zeroing_quiet(pos, move, capture) && pos.rule50_count() < 70 && !low_material(pos))'''
          new2='''    // Authority 2 funds rescued scope from late stable branches. v2.1.3\n    // restores useful compression on ordinary pawn moves while excluding the\n    // contextual imminent-pawn class above.\n    if (state().authority >= 2 && depth >= 5 && moveCount >= 6 && !pvNode && !capture\n        && !givesCheck && move.type_of() != PROMOTION && !advanced_pawn_move(pos, move)\n        && pos.rule50_count() < 70 && !low_material(pos))'''
          assert s.count(old2)==1;p.write_text(s.replace(old2,new2,1))
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/leviathan_fundamentals.h
          git commit -m 'Add contextual imminent-pawn search gradient in v2.1.3'
          git push origin HEAD:leviathan/fundamentals-v2.1.3-imminent-pawn
