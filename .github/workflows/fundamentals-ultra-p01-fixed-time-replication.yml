name: Fundamentals Ultra P01 Fixed-Time Replication

on:
  push:
    branches: [leviathan/fundamentals-ultra-lab]
    paths: ['.github/workflows/fundamentals-ultra-p01-fixed-time-replication.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: lab}
      - uses: actions/checkout@v4
        with: {ref: leviathan/fundamentals-ultra-p01-qfrontier, path: p01}
      - name: Build P01 and current Stockfish
        run: |
          make -C p01/src net && make -C p01/src clean && make -C p01/src -j2 ARCH=x86-64-avx2 build
          git clone -q https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          git -C "$RUNNER_TEMP/sf" checkout -q 5062aee519a1ba262d472d8ab139851ced56573e
          make -C "$RUNNER_TEMP/sf/src" -j2 ARCH=x86-64-avx2 build
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Generate 50 fresh balanced opening pairs
        run: |
          seed=$((424242420 + ${{ matrix.shard }} * 100003))
          python3 lab/tools/generate_balanced_openings.py --stockfish "$RUNNER_TEMP/sf/src/stockfish" --output openings.json --count 50 --plies 18 --seed "$seed" --max-abs-cp 100
          sha256sum openings.json > openings.sha256
      - name: 100-game fixed-time shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p match
          python3 lab/tools/fundamentals_tournament.py --candidate "$PWD/p01/src/stockfish" --opponent "$RUNNER_TEMP/sf/src/stockfish" --candidate-label Ultra-P01 --opponent-label Stockfish-5062aee5 --candidate-fundamentals --move-time-ms 100 --openings-json "$PWD/openings.json" --max-plies 200 --output-dir match | tee match/match.log
          test -s match/summary.json
          test -s match/games.jsonl
      - name: Provenance
        run: |
          printf 'p01=%s\nstockfish=%s\nshard=${{ matrix.shard }}\n' "$(git -C p01 rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/sf" rev-parse HEAD)" > revisions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 'p01-fixed-time-${{ matrix.shard }}'
          path: |
            match
            openings.json
            openings.sha256
            revisions.txt
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'p01-fixed-time-*', path: shards}
      - name: Aggregate paired results
        run: |
          python3 - <<'PY'
          import glob,json,math,random,statistics
          games=[]; pair_scores=[]; shard_summaries=[]
          for d in sorted(glob.glob('shards/p01-fixed-time-*')):
              s=json.load(open(d+'/match/summary.json')); shard_summaries.append(s)
              rows=[json.loads(x) for x in open(d+'/match/games.jsonl') if x.strip()]
              games.extend(rows)
              by={}
              for g in rows: by.setdefault(g['opening'],[]).append(g['candidate_score'])
              assert len(by)==50 and all(len(v)==2 for v in by.values())
              pair_scores += [sum(v)/2 for v in by.values()]
          assert len(games)==400 and len(pair_scores)==200
          score=sum(g['candidate_score'] for g in games)/len(games)
          w=sum(g['candidate_score']==1 for g in games); dr=sum(g['candidate_score']==.5 for g in games); l=sum(g['candidate_score']==0 for g in games)
          rng=random.Random(8910); boot=[]
          for _ in range(100000): boot.append(statistics.fmean(pair_scores[rng.randrange(len(pair_scores))] for __ in range(len(pair_scores))))
          boot.sort(); lo=boot[2500]; hi=boot[97500]
          elo=400*math.log10(score/(1-score)) if 0<score<1 else None
          out={'schema':'LV_P01_FIXED_TIME_REPLICATION_V1','games':400,'opening_pairs':200,'wins':w,'draws':dr,'losses':l,'score_fraction':score,'naive_logistic_elo':elo,'pair_bootstrap_95pct_score':[lo,hi],'pair_mean':statistics.fmean(pair_scores),'pair_sd':statistics.stdev(pair_scores),'shards':shard_summaries,'rule':'fresh prospective replication; same P01 and Stockfish revisions, 100 ms/move'}
          open('aggregate.json','w').write(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-p01-fixed-time-aggregate
          path: aggregate.json
          retention-days: 30
