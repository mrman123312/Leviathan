[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan-cognitive-architecture"
version = "0.2.0"
description = "Research scaffold for an adaptive metacognitive cognitive architecture"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
models = ["huggingface_hub>=0.27"]
inference = [
  "torch>=2.7",
  "transformers>=4.57.1",
  "accelerate>=1.2",
  "safetensors>=0.5",
]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
