[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan-cognitive-architecture"
version = "0.1.0"
description = "Research scaffold for an adaptive metacognitive cognitive architecture"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
