[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan-cognitive-architecture"
version = "0.4.0"
description = "Single-model research scaffold for an adaptive cognitive architecture"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["huggingface_hub>=0.27"]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
